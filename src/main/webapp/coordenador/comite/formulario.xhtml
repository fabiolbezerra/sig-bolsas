<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <ui:define name="title">
        Cadastro de Comitê
    </ui:define>
    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-users"></i>
                    Cadastro de Comitê
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formComite">
                    <p:growl showDetail="true" showSummary="true"/>
                    <h:inputHidden value="#{comiteBean.comite.id}"/>

                    <div class="ui-fluid">
                        <div class="p-grid p-formgrid"
                             style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                            <div class="p-field">
                                <p:outputLabel for="portaria" value="Portaria" style="font-weight: 600;"/>
                                <p:inputText id="portaria" value="#{comiteBean.comite.portaria}"
                                             required="true"
                                             requiredMessage="A portaria é obrigatória"
                                             style="width: 100%"/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="inicio" value="Início da vigência" style="font-weight: 600;"/>
                                <p:calendar id="inicio" pattern="dd/MM/yyyy" value="#{comiteBean.comite.inicio}"
                                            required="true"
                                            requiredMessage="Data inicial é obrigatória"
                                            showOn="button"/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="fim" value="Fim da vigência" style="font-weight: 600;"/>
                                <p:calendar id="fim" pattern="dd/MM/yyyy" value="#{comiteBean.comite.fim}"
                                            required="true"
                                            requiredMessage="Data final é obrigatória"
                                            showOn="button"/>
                            </div>
                            <div class="p-field">
                                <p:outputLabel for="coordenador" value="Coordenador" style="font-weight: 600;"/>
                                <p:selectOneMenu id="coordenador" converter="pessoaConverter"
                                                 value="#{comiteBean.comite.coordenador}"
                                                 style="width: 100%">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione um coordenador"/>
                                    <f:selectItems value="#{pessoaBean.coordenadores}"
                                                   var="p"
                                                   itemValue="#{p}"
                                                   itemLabel="#{p.nomeCompleto}"/>
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 0.5rem; margin-bottom: 2rem;">
                        <p:commandButton value="Salvar"
                                         action="#{comiteBean.salvar()}"
                                         update="@form"
                                         icon="pi pi-check"
                                         styleClass="ui-button-success"
                                         rendered="#{comiteBean.comite.id == null or comiteBean.comite.id == 0}"/>
                        <p:button outcome="#{comiteBean.voltar()}" value="Cancelar" icon="pi pi-times"
                                  styleClass="ui-button-secondary outline"
                                  rendered="#{comiteBean.comite.id == null or comiteBean.comite.id == 0}"/>
                    </div>

                    <p:panel rendered="#{comiteBean.comite.id != null and comiteBean.comite.id > 0}"
                             header="Pesquisadores do Comitê"
                             styleClass="content-card"
                             id="painelPesquisadores">

                        <div style="margin-bottom: 2rem; background: #f8f9fa; padding: 1.5rem; border-radius: 8px; border: 1px solid #e9ecef;">
                            <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 250px;">
                                    <p:outputLabel for="selectPesquisador" value="Adicionar Pesquisador"
                                                   style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #495057;"/>
                                    <p:selectOneMenu id="selectPesquisador"
                                                     converter="pessoaConverter"
                                                     value="#{comiteBean.pesquisadorSelecionado}"
                                                     style="width: 100%;">
                                        <f:selectItem noSelectionOption="true" itemLabel="Selecione um pesquisador"/>
                                        <f:selectItems value="#{pessoaBean.pesquisadores}"
                                                       var="pesq"
                                                       itemValue="#{pesq}"
                                                       itemLabel="#{pesq.nomeCompleto}"/>
                                    </p:selectOneMenu>
                                </div>
                                <p:commandButton value="Adicionar"
                                                 action="#{comiteBean.adicionarPesquisador()}"
                                                 update="@form"
                                                 process="@form"
                                                 icon="pi pi-plus"
                                                 styleClass="ui-button-primary"
                                                 id="btnAdicionar"/>
                            </div>
                        </div>

                        <p:dataTable value="#{comiteBean.comite.comitePessoas}"
                                     var="comitePessoa"
                                     emptyMessage="Nenhuma informação a ser exibida"
                                     paginator="true" rows="10" paginatorPosition="bottom"
                                     reflow="true"
                                     id="tabelaPesquisadores">

                            <p:column headerText="Nome Completo" sortBy="#{comitePessoa.pessoa.nomeCompleto}"
                                      priority="1">
                                <h:outputText value="#{comitePessoa.pessoa.nomeCompleto}" style="font-weight: 600;"/>
                            </p:column>

                            <p:column headerText="Email" priority="2">
                                <h:outputText value="#{comitePessoa.pessoa.email}"/>
                            </p:column>

                            <p:column headerText="Ações" style="text-align: center; width: 100px;" priority="1">
                                <p:commandButton icon="pi pi-trash"
                                                 title="Remover pesquisador"
                                                 action="#{comiteBean.removerPesquisador(comitePessoa.pessoa)}"
                                                 update="@form"
                                                 process="@form"
                                                 styleClass="ui-button-danger ui-button-flat"
                                                 onclick="return confirm('Tem certeza que deseja remover este pesquisador do comitê?');">
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>

                        <div style="margin-top: 2rem;">
                            <p:button outcome="#{comiteBean.voltar()}" value="Voltar" icon="pi pi-arrow-left"
                                      styleClass="ui-button-secondary outline"/>
                        </div>
                    </p:panel>

                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
