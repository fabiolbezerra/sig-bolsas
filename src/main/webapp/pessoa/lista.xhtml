<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Pessoas</title>
</h:head>
<h:body>
    <h1>Pessoas</h1>

    <h:form id="formPessoa">
        <p:growl showDetail="true" showSummary="true"/>

        <p:commandLink value="Cadastrar pessoa" action="formulario.xhtml" /> <br/><br/>

        <p:dataTable value="#{pessoaBean.pessoas}" var="pessoa">
            <p:column headerText="Nome Completo">
                <h:outputText value="#{pessoa.nomeCompleto}"/>
            </p:column>

            <p:column headerText="Telefone">
                <h:outputText value="#{pessoa.telefone}"/>
            </p:column>

            <p:column headerText="E-mail">
                <h:outputText value="#{pessoa.email}"/>
            </p:column>

            <p:column headerText="Nascimento">
                <h:outputText value="#{pessoa.nascimento}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Operações">
                <p:commandLink value="Editar" action="formulario.xhtml" >
                    <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                </p:commandLink>
                |
                <p:commandLink value="Detalhes" action="detalhes.xhtml" >
                    <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                </p:commandLink>
            </p:column>
        </p:dataTable>
    </h:form>
</h:body>
</html>
