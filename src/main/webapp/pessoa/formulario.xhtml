<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Pessoa</title>
</h:head>
<h:body>
    <h1>Pessoa</h1>

    <h:form id="formPessoa">
        <p:growl showDetail="true" showSummary="true"/>

        <h:inputHidden value="#{pessoaBean.pessoa.id}" />
        <h:panelGrid columns="2">
            <p:outputLabel value="Nome completo" />
            <p:inputText value="#{pessoaBean.pessoa.nomeCompleto}" />

            <p:outputLabel value="Telefone" />
            <p:inputMask mask="99999999999" value="#{pessoaBean.pessoa.telefone}" />

            <p:outputLabel value="E-mail" />
            <p:inputText value="#{pessoaBean.pessoa.email}" />

            <p:outputLabel value="Data de nascimento" />
            <p:calendar pattern="dd/MM/yyyy" value="#{pessoaBean.pessoa.nascimento}" />
        </h:panelGrid>

        <p:button outcome="lista.xhtml" value="Cancelar"/>
        <p:commandButton value="Salvar" action="#{pessoaBean.salvar()}"/>
    </h:form>
</h:body>
</html>
