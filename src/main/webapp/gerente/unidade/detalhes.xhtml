<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
>

    <ui:define name="title">Detalhes da Unidade</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-building"></i>
                    #{unidadeAdministrativaBean.unidade.nome}
                </h1>
                <p:commandButton value="Voltar" action="lista.xhtml" icon="pi pi-arrow-left"
                                 styleClass="ui-button-secondary outline"/>
            </div>

            <div class="content-card">
                <h:form id="formComite">
                    <p:growl showDetail="true" showSummary="true"/>

                    <!-- Informações da Unidade -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-info-circle"></i>
                            Dados da Unidade Administrativa
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Nome"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{unidadeAdministrativaBean.unidade.nome}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Sigla"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{unidadeAdministrativaBean.unidade.sigla}"
                                              style="font-weight: 600; color: #212529; font-size: 1.1rem;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Tipo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{unidadeAdministrativaBean.unidade.tipo.descricao}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                        </div>
                    </div>

                    <!-- Membros da Unidade -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-users"></i>
                            Membros
                        </h2>

                        <p:dataTable value="#{unidadeAdministrativaBean.unidade.membros}"
                                     var="membro"
                                     emptyMessage="Nenhum membro vinculado a esta unidade"
                                     reflow="true"
                                     styleClass="ui-datatable-sm">
                            <p:column headerText="Nome Completo" priority="1">
                                <h:outputText value="#{membro.nomeCompleto}" style="font-weight: 500;"/>
                            </p:column>
                            <p:column headerText="Telefone" priority="2">
                                <h:outputText value="#{membro.telefone}" converter="telefoneConverter"/>
                            </p:column>
                            <p:column headerText="E-mail" priority="3">
                                <h:outputText value="#{membro.email}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
