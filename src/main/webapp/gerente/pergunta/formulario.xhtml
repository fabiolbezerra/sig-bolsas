<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Perguntas do Formulário
    </ui:define>

    <ui:define name="content">

        <h1>Perguntas do Formulário</h1>

        <div class="ui-g">
            <div class="ui-g-4">
                <h2>Cadastro de Pergunta</h2>

                <h:form id="formPergunta">
                    <p:growl showDetail="true" showSummary="true"/>

                    <h:inputHidden value="#{perguntaBean.pergunta.id}"/>
                    <h:panelGrid columns="2">

                        <p:outputLabel value="Texto da pergunta" for="itaTexto"/>
                        <p:inputTextarea id="itaTexto"
                                         required="true"
                                         value="#{perguntaBean.pergunta.texto}"
                                         rows="3"
                                         maxlength="250"/>

                        <p:outputLabel value="Pontuação" for="inPontuacao"/>
                        <p:inputNumber id="inPontuacao"
                                       decimalPlaces="2"
                                       decimalSeparator=","
                                       required="true"
                                       value="#{perguntaBean.pergunta.pontuacao}"/>

                        <p:outputLabel value="Tipo de pergunta"/>
                        <p:selectOneMenu value="#{perguntaBean.pergunta.tipo}"
                                         converter="tipoPerguntaConverter"
                                         onchange="#{perguntaBean.selecionarTipo}">
                            <f:selectItem noSelectionOption="true"
                                          itemValue="null"
                                          itemLabel="Selecione o tipo de pergunta"/>
                            <f:selectItems value="#{tipoEnumBean.tiposDePergunta}"
                                           var="tp"
                                           itemValue="#{tp}"
                                           itemLabel="#{tp.descricao}"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <!-- https://stackoverflow.com/questions/17587304/how-to-use-if-else-condition-in-jsf-to-display-image -->

                    <p:button outcome="/gerente/formulario/lista.xhtml" value="Cancelar"
                              icon="fa fa-ban"/>
                    <p:commandButton value="Limpar"
                                     icon="fa fa-trash-o"
                                     action="#{perguntaBean.atualizar()}"
                                     update="formPergunta"/>
                    <p:commandButton value="Salvar"
                                     icon="fa fa-floppy-o"
                                     action="#{perguntaBean.salvar()}"
                                     update="formPergunta formListaDePerguntas"/>
                </h:form>
            </div>

            <div class="ui-g-8">
                <h2>#{perguntaBean.formulario.nome}</h2>

                <h:form id="formListaDePerguntas">
                    <p:growl showDetail="true" showSummary="true"/>

                    <ui:repeat value="#{perguntaBean.perguntas}" var="pergunta" varStatus="status">
                        <p:panel>
                            <f:facet name="header">
                                Pergunta #{pergunta.ordem}
                                <div class="top_direita">
                                    <p:commandButton icon="fa fa-pencil"
                                                     update="formPergunta formListaDePerguntas">
                                        <f:setPropertyActionListener target="#{perguntaBean.pergunta}"
                                                                     value="#{pergunta}"/>
                                    </p:commandButton>

                                    <p:commandButton icon="fa fa-arrow-up"
                                                     rendered="#{not status.first}"
                                                     actionListener="#{perguntaBean.moverParaCima(pergunta)}"
                                                     update="formPergunta formListaDePerguntas"/>

                                    <p:commandButton icon="fa fa-arrow-down"
                                                     rendered="#{not status.last}"
                                                     actionListener="#{perguntaBean.moverParaBaixo(pergunta)}"
                                                     update="formPergunta formListaDePerguntas"/>

                                    <p:commandButton icon="fa fa-trash"
                                                     actionListener="#{perguntaBean.excluir(pergunta)}"
                                                     update="formPergunta formListaDePerguntas"/>
                                </div>
                            </f:facet>

                            <h:panelGrid columns="1" style="width: 100%">
                                <p:outputLabel value="#{pergunta.texto}" style="font-weight: bold"/>

                                <h:panelGroup rendered="#{pergunta.tipo.tipoTexto}">
                                    <p:inputText value="Exemplo de texto" readonly="true"/>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{pergunta.tipo.tipoInteiro}">
                                    <p:inputNumber value="123" readonly="true" disabled="true"/>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{pergunta.tipo.tipoData}">
                                    <p:calendar value="#{now}" disabled="true"/>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{pergunta.tipo.tipoSimOuNao}">
                                    <p:inputSwitch value="true" disabled="true"/>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{pergunta.tipo.tipoRespostaFechada}">
                                    <p:selectOneRadio disabled="true">
                                        <f:selectItems value="#{pergunta.opcaoPerguntas}"
                                                       var="opcao"
                                                       itemLabel="#{opcao.resposta}"
                                                       itemValue="#{opcao.resposta}"/>
                                    </p:selectOneRadio>
                                </h:panelGroup>
                            </h:panelGrid>

                            <f:facet name="footer">
                                Pontuação #{pergunta.pontuacao}
                            </f:facet>
                        </p:panel>
                        <br/>
                    </ui:repeat>

                </h:form>
            </div>

        </div>

    </ui:define>
</ui:composition>
