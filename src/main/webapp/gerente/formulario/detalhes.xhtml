<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">
        Detalhes de um formulário
    </ui:define>

    <ui:define name="content">
        <h1>#{formularioBean.formulario.nome}</h1>

        <h:form id="formPessoa">

            <h2>#{formularioBean.formulario.nome}</h2>

            <h3>Perguntas</h3>
            
            <p:dataList value="#{formularioBean.formulario.perguntas}"
                        var="pergunta"
                        emptyMessage="Nenhuma pergunta adicionada">
                <h:outputText value="#{pergunta.texto}" />
            </p:dataList>

            <br/>

            <p:commandLink value="Voltar" action="lista.xhtml" />
        </h:form>
    </ui:define>
</ui:composition>
