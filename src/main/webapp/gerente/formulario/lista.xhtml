<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Formulários
    </ui:define>

    <ui:define name="content">

        <h1>Formulários de Inscrição</h1>

        <br/>

        <p:link value="Cadastrar Formulário" outcome="formulario.xhtml"/>

        <br/><br/>

        <h:form id="formPapel">

            <p:growl showDetail="true" showSummary="true"/>

            <p:dataTable value="#{formularioBean.formularios}" var="formulario">
                <p:column headerText="Nome">
                    <h:outputText value="#{formulario.nome}"/>
                </p:column>

                <p:column headerText="Data de Criação">
                    <h:outputText value="#{formulario.dataCriacao}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">
                    <p:splitButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-search">
                        <f:setPropertyActionListener value="#{formulario}" target="#{formularioBean.formulario}"/>

                        <p:menuitem value="Editar" action="formulario.xhtml" icon="fa fa-pencil">
                            <f:setPropertyActionListener value="#{formulario}" target="#{formularioBean.formulario}"/>
                        </p:menuitem>

                        <p:menuitem value="Perguntas" action="formulario-perguntas.xhtml" icon="fa fa-pencil">
                            <f:param name="formularioID" value="#{formulario.id}"/>
                        </p:menuitem>

                    </p:splitButton>
                </p:column>
            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
