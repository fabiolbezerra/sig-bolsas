<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">Formulários de Inscrição</ui:define>

    <ui:define name="content">
        <style type="text/css">
            @media (min-width: 641px) {
                .mobile-only {
                    display: none !important;
                }
            }
        </style>
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-file-edit"></i>
                    Formulários de Inscrição
                </h1>

                <p:link outcome="formulario.xhtml" styleClass="btn-new">
                    <i class="pi pi-plus"></i>
                    <span>Cadastrar Formulário</span>
                </p:link>
            </div>

            <div class="content-card">
                <h:form id="formPapel">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{formularioBean.formularios}"
                                 var="formulario"
                                 paginator="true"
                                 rows="10"
                                 rowHover="true"
                                 paginatorPosition="bottom"
                                 reflow="true"
                                 emptyMessage="Nenhum formulário cadastrado">

                        <p:column headerText="Nome" priority="1">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{formulario.nome}" style="font-weight: 600; color: #2c3e50;"/>
                                <h:outputText value="#{formulario.dataCriacao}"
                                              style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;"
                                              class="mobile-only">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </p:column>

                        <p:column headerText="Data de Criação" priority="2" styleClass="text-center">
                            <h:outputText value="#{formulario.dataCriacao}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column" priority="1">
                            <p:splitButton value="Detalhes"
                                           action="detalhes.xhtml"
                                           icon="pi pi-info-circle"
                                           styleClass="split-action">
                                <f:setPropertyActionListener value="#{formulario}"
                                                             target="#{formularioBean.formulario}"/>

                                <p:menuitem value="Editar"
                                            action="formulario.xhtml"
                                            icon="pi pi-pencil">
                                    <f:setPropertyActionListener value="#{formulario}"
                                                                 target="#{formularioBean.formulario}"/>
                                </p:menuitem>

                                <p:menuitem value="Perguntas"
                                            outcome="/gerente/pergunta/formulario.xhtml"
                                            icon="pi pi-question-circle">
                                    <f:param name="formularioID" value="#{formulario.id}"/>
                                </p:menuitem>
                            </p:splitButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
