<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Perguntas do Formulário
    </ui:define>

    <ui:define name="content">

        <h1>Perguntas do Formulário</h1>

        <div class="ui-g">
            <div class="ui-g-4">
                <h2>Cadastro de Pergunta</h2>

                <h:form id="formPergunta">
                    <p:growl showDetail="true" showSummary="true"/>

                    <h:inputHidden value="#{perguntaBean.pergunta.id}"/>
                    <h:panelGrid columns="2">

                        <p:outputLabel value="Texto da pergunta" for="itaTexto"/>
                        <p:inputTextarea id="itaTexto"
                                         required="true"
                                         value="#{perguntaBean.pergunta.texto}"
                                         rows="3"
                                         maxlength="250"/>

                        <p:outputLabel value="Pontuação" for="inPontuacao"/>
                        <p:inputNumber id="inPontuacao"
                                       decimalPlaces="2"
                                       decimalSeparator=","
                                       required="true"
                                       value="#{perguntaBean.pergunta.pontuacao}"/>

                        <p:outputLabel value="Tipo de pergunta"/>
                        <p:selectOneMenu value="#{perguntaBean.pergunta.tipo}" converter="tipoPerguntaConverter">
                            <f:selectItem noSelectionOption="true" itemLabel="Selecione o tipo de pergunta"/>
                            <f:selectItems value="#{tipoEnumBean.tiposDePergunta}" var="tp"
                                           itemValue="#{tp}" itemLabel="#{tp.toString()}"/>
                        </p:selectOneMenu>

                    </h:panelGrid>

                    <p:button outcome="lista.xhtml" value="Cancelar"/>
                    <p:commandButton value="Salvar" action="#{perguntaBean.salvar()}" update="@all"/>
                </h:form>
            </div>
            <div class="ui-g-8">
                <h2>#{perguntaBean.formulario.nome}</h2>

                <h:form id="formListaDePerguntas">
                    <p:growl showDetail="true" showSummary="true"/>

                    <ui:repeat value="#{perguntaBean.perguntas}" var="pergunta">
                        <p:outputPanel>
                            <f:facet name="header">
                                Pergunta #{pergunta.ordem}
                            </f:facet>

                            <p:outputLabel value="#{pergunta.texto}"/>
                            <!-- https://stackoverflow.com/questions/17587304/how-to-use-if-else-condition-in-jsf-to-display-image -->
                        </p:outputPanel>
                        <br/>
                    </ui:repeat>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
