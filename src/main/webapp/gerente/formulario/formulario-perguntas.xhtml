<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Perguntas do Formulário</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-question-circle"></i>
                    Perguntas do Formulário
                </h1>

                <p:button outcome="lista.xhtml"
                          value="Voltar"
                          icon="pi pi-arrow-left"
                          styleClass="ui-button-secondary outline"/>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; margin-top: 1.5rem;">
                <!-- Coluna Esquerda: Cadastro de Pergunta -->
                <div class="content-card">
                    <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                        <i class="pi pi-plus-circle"></i>
                        Cadastro de Pergunta
                    </h2>

                    <h:form id="formPergunta">
                        <p:growl showDetail="true" showSummary="true"/>

                        <h:inputHidden value="#{perguntaBean.pergunta.id}"/>

                        <div class="ui-fluid">
                            <div class="p-field" style="margin-bottom: 1.5rem;">
                                <p:outputLabel for="itaTexto" value="Texto da Pergunta"
                                               style="font-weight: 600; display: block; margin-bottom: 0.5rem;"/>
                                <p:inputTextarea id="itaTexto"
                                                 value="#{perguntaBean.pergunta.texto}"
                                                 rows="3"
                                                 maxlength="250"
                                                 required="true"
                                                 requiredMessage="O texto da pergunta é obrigatório"
                                                 placeholder="Digite o texto da pergunta (máx. 250 caracteres)"
                                                 style="width: 100%"/>
                            </div>

                            <div class="p-field" style="margin-bottom: 1.5rem;">
                                <p:outputLabel for="inPontuacao" value="Pontuação"
                                               style="font-weight: 600; display: block; margin-bottom: 0.5rem;"/>
                                <p:inputNumber id="inPontuacao"
                                               value="#{perguntaBean.pergunta.pontuacao}"
                                               decimalPlaces="2"
                                               decimalSeparator=","
                                               required="true"
                                               requiredMessage="A pontuação é obrigatória"
                                               style="width: 100%"/>
                            </div>

                            <div class="p-field" style="margin-bottom: 1.5rem;">
                                <p:outputLabel for="tipoPergunta" value="Tipo de Pergunta"
                                               style="font-weight: 600; display: block; margin-bottom: 0.5rem;"/>
                                <p:selectOneMenu id="tipoPergunta"
                                                 value="#{perguntaBean.pergunta.tipo}"
                                                 converter="tipoPerguntaConverter"
                                                 style="width: 100%">
                                    <f:selectItem noSelectionOption="true"
                                                  itemValue="null"
                                                  itemLabel="Selecione o tipo de pergunta"/>
                                    <f:selectItems value="#{tipoEnumBean.tiposDePergunta}"
                                                   var="tp"
                                                   itemValue="#{tp}"
                                                   itemLabel="#{tp.toString()}"/>
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem;">
                            <p:commandButton value="Salvar"
                                             action="#{perguntaBean.salvar()}"
                                             update="formPergunta formListaDePerguntas"
                                             icon="pi pi-check"
                                             styleClass="ui-button-success"
                                             style="width: 100%"/>
                            <p:commandButton value="Limpar"
                                             action="#{perguntaBean.atualizar()}"
                                             update="formPergunta"
                                             icon="pi pi-refresh"
                                             styleClass="ui-button-warning"
                                             style="width: 100%"/>
                        </div>
                    </h:form>
                </div>

                <!-- Coluna Direita: Lista de Perguntas -->
                <div class="content-card">
                    <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                        <i class="pi pi-list"></i>
                        #{perguntaBean.formulario.nome}
                    </h2>

                    <h:form id="formListaDePerguntas">
                        <p:growl showDetail="true" showSummary="true"/>

                        <ui:repeat value="#{perguntaBean.perguntas}" var="pergunta">
                            <p:panel style="margin-bottom: 1rem;">
                                <f:facet name="header">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="font-weight: 600;">Pergunta ##{pergunta.ordem}</span>
                                        <div style="display: flex; gap: 0.5rem;">
                                            <p:commandButton icon="pi pi-pencil"
                                                             update="formPergunta formListaDePerguntas"
                                                             title="Editar"
                                                             styleClass="ui-button-warning">
                                                <f:setPropertyActionListener target="#{perguntaBean.pergunta}"
                                                                             value="#{pergunta}"/>
                                            </p:commandButton>

                                            <p:commandButton icon="pi pi-arrow-up"
                                                             actionListener="#{perguntaBean.moverParaCima(pergunta)}"
                                                             update="formPergunta formListaDePerguntas"
                                                             title="Mover para cima"
                                                             styleClass="ui-button-secondary"/>

                                            <p:commandButton icon="pi pi-arrow-down"
                                                             actionListener="#{perguntaBean.moverParaBaixo(pergunta)}"
                                                             update="formPergunta formListaDePerguntas"
                                                             title="Mover para baixo"
                                                             styleClass="ui-button-secondary"/>

                                            <p:commandButton icon="pi pi-trash"
                                                             actionListener="#{perguntaBean.excluir(pergunta)}"
                                                             update="formPergunta formListaDePerguntas"
                                                             title="Excluir"
                                                             styleClass="ui-button-danger"
                                                             onclick="return confirm('Deseja realmente excluir esta pergunta?')"/>
                                        </div>
                                    </div>
                                </f:facet>

                                <f:facet name="footer">
                                    <span style="font-weight: 600; color: #036fab;">Pontuação: #{pergunta.pontuacao}</span>
                                </f:facet>

                                <div style="padding: 0.5rem 0;">
                                    <p:outputLabel value="#{pergunta.texto}" style="font-size: 1rem; color: #212529;"/>
                                    <p:dataList value="#{pergunta.opcaoPerguntas}"
                                                var="opcao"
                                                rendered="#{not empty pergunta.opcaoPerguntas}"
                                                style="margin-top: 0.75rem;">
                                        <h:outputText value="• #{opcao.resposta}" style="color: #6c757d;"/>
                                    </p:dataList>
                                </div>
                            </p:panel>
                        </ui:repeat>

                        <p:panel rendered="#{empty perguntaBean.perguntas}"
                                 style="text-align: center; padding: 2rem; background: #f8f9fa;">
                            <i class="pi pi-info-circle" style="font-size: 2rem; color: #6c757d;"></i>
                            <p style="margin-top: 1rem; color: #6c757d;">Nenhuma pergunta cadastrada ainda.</p>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
