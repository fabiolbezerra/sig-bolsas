<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Cadastro de Formulário
    </ui:define>

    <ui:define name="content">
        <h1>Formulário de Inscrição</h1>

        <h:form id="formFormulario">
            <p:growl showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{formularioBean.formulario.id}"/>
            <h:inputHidden value="#{formularioBean.formulario.dataCriacao}">
                <f:convertDateTime pattern="dd/MM/yyyy hh:mm"/>
            </h:inputHidden>

            <h:panelGrid columns="2">

                <p:outputLabel value="Nome"/>
                <p:inputText value="#{formularioBean.formulario.nome}"/>

            </h:panelGrid>

            <p:button outcome="lista.xhtml" value="Cancelar" icon="fa fa-ban"/>
            <p:commandButton value="Salvar" action="#{formularioBean.salvar()}" update="@form" icon="fa fa-floppy-o"/>
        </h:form>
    </ui:define>
</ui:composition>
