<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Editais Encerrados
    </ui:define>

    <ui:define name="content">
        <style type="text/css">
            @media (min-width: 641px) {
                .mobile-only {
                    display: none !important;
                }
            }
        </style>
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-file-excel"></i>
                    Editais com Inscrição Encerrada
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formEdital">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{editalBean.editaisEncerrados}" var="edital"
                                 emptyMessage="Nenhuma informação a ser exibida"
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Título" priority="1">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{edital.titulo}" style="font-weight: 600; color: #2c3e50;"/>
                                <h:outputText value="#{edital.ano} / #{edital.numero}"
                                              style="font-size: 0.85rem; color: #666;" class="mobile-only"/>
                            </div>
                        </p:column>

                        <p:column headerText="Ano e Número" priority="3">
                            <h:outputText value="#{edital.ano}"/> / <h:outputText value="#{edital.numero}"/>
                        </p:column>

                        <p:column headerText="Cadastro" priority="4">
                            <h:outputText value="#{edital.dataCadastro}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Inscrições" priority="2">
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <h:outputText value="#{edital.dataInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                                <span style="color: #adb5bd;">a</span>
                                <h:outputText value="#{edital.dataFinal}">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </p:column>

                        <p:column headerText="Situação" priority="4">
                            <h:outputText value="#{editalBean.obterSituacao(edital.situacao)}"/>
                        </p:column>

                        <p:column headerText="Tipo" priority="5">
                            <h:outputText value="#{editalBean.obterTipo(edital.tipo)}"/>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column" priority="1">
                            <p:commandButton value="Detalhes" action="/bolsista/edital/detalhes.xhtml"
                                             icon="pi pi-info-circle" styleClass="ui-button-outlined">
                                <f:param name="editalID" value="#{edital.id}"/>
                                <f:setPropertyActionListener target="#{editalBean.edital}" value="#{edital}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
