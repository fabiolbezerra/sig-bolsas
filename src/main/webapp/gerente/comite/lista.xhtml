<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Comitês
    </ui:define>

    <ui:define name="content">
        <style type="text/css">
            @media (min-width: 641px) {
                .mobile-only {
                    display: none !important;
                }
            }
        </style>
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-users"></i>
                    Listagem de Comitês
                </h1>

                <p:link outcome="/coordenador/comite/formulario.xhtml"
                        rendered="#{papelBean.usuarioLogadoAdministrador or papelBean.usuarioLogadoCoordenador}"
                        styleClass="btn-new">
                    <i class="pi pi-plus"></i>
                    <span>Cadastrar Comitê</span>
                </p:link>
            </div>

            <div class="content-card">
                <h:form id="formComite">
                    <p:growl showDetail="true" showSummary="true"/>
                    <f:param name="listaid" value="1"/>

                    <p:dataTable value="#{comiteBean.comites}" var="comite"
                                 emptyMessage="Nenhuma informação a ser exibida"
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Portaria" filterBy="#{comite.portaria}" filterMatchMode="contains"
                                  priority="1">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{comite.portaria}" styleClass="portaria-text"
                                              style="font-weight: 600;"/>
                                <h:outputText value="Criado por: #{comite.coordenador.nomeCompleto}"
                                              style="font-size: 0.8rem; color: #666;" class="mobile-only"/>
                            </div>
                        </p:column>

                        <p:column headerText="Início da vigência" styleClass="text-center" priority="3">
                            <h:outputText value="#{comite.inicio}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Fim da vigência" styleClass="text-center" priority="2">
                            <h:outputText value="#{comite.fim}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Cadastrado por" priority="4">
                            <h:outputText value="#{comite.coordenador.nomeCompleto}"/>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column">
                            <p:splitButton value="Detalhes" action="/gerente/comite/detalhes.xhtml"
                                           icon="pi pi-info-circle" styleClass="split-action">
                                <f:param name="comite" value="#{comite.id}"/>
                                <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>

                                <p:menuitem value="Editar"
                                            action="/coordenador/comite/formulario.xhtml"
                                            icon="pi pi-pencil"
                                            rendered="#{papelBean.usuarioLogadoAdministrador or papelBean.usuarioLogadoCoordenador}">
                                    <f:param name="comite" value="#{comite.id}"/>
                                    <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>
                                </p:menuitem>
                            </p:splitButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
