<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Triagem de Bolsistas</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-users"></i>
                    Triagem de Inscrições de Bolsistas
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formTriagem">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{triagemBolsistaBean.inscricoes}"
                                 var="inscricao"
                                 emptyMessage="Nenhuma inscrição de bolsista encontrada."
                                 paginator="true"
                                 rows="15"
                                 paginatorPosition="bottom"
                                 reflow="true"
                                 widgetVar="dtTriagem">

                        <f:facet name="header">
                            <div style="display: flex; justify-content: flex-end;">
                                <p:inputText id="globalFilter" onkeyup="PF('dtTriagem').filter()"
                                             placeholder="Buscar..." style="width: 220px;"/>
                            </div>
                        </f:facet>

                        <p:column headerText="Bolsista" priority="1" filterBy="#{inscricao.pessoa.nomeCompleto}">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{inscricao.pessoa.nomeCompleto}"
                                              style="font-weight: 600; color: #2c3e50;"/>
                                <h:outputText value="#{inscricao.pessoa.email}"
                                              style="font-size: 0.82rem; color: #666;"/>
                            </div>
                        </p:column>

                        <p:column headerText="Plano de Trabalho" priority="2">
                            <h:outputText value="#{inscricao.planoDeTrabalho.titulo}"/>
                        </p:column>

                        <p:column headerText="Protocolo" priority="3" style="width:160px;">
                            <h:outputText value="#{inscricao.protocolo}"
                                          style="font-family: monospace; font-size: 0.9rem;"/>
                        </p:column>

                        <p:column headerText="Data" priority="3" style="width:110px;">
                            <h:outputText value="#{inscricao.dataInscricao}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Situação" priority="1" style="width:120px; text-align:center;">
                            <p:tag value="#{triagemBolsistaBean.obterDescricaoSituacao(inscricao.situacao)}"
                                   severity="#{inscricao.situacao == 'A' ? 'success' :
                                               inscricao.situacao == 'I' ? 'danger' :
                                               inscricao.situacao == 'H' ? 'info' : 'warning'}"/>
                        </p:column>

                        <p:column headerText="Ações" priority="1" style="width:180px; text-align:center;">
                            <p:commandButton icon="pi pi-check"
                                             title="Homologar"
                                             styleClass="ui-button-info"
                                             style="margin-right: 0.25rem;"
                                             update="formTriagem"
                                             ajax="true"
                                             actionListener="#{triagemBolsistaBean.homologar(inscricao)}"
                                             rendered="#{inscricao.situacao == 'P'}">
                                <p:confirm header="Confirmar" message="Homologar esta inscrição?" icon="pi pi-info-circle"/>
                            </p:commandButton>

                            <p:commandButton icon="pi pi-check-circle"
                                             title="Aprovar"
                                             styleClass="ui-button-success"
                                             style="margin-right: 0.25rem;"
                                             update="formTriagem"
                                             ajax="true"
                                             actionListener="#{triagemBolsistaBean.aprovar(inscricao)}"
                                             rendered="#{inscricao.situacao == 'H'}">
                                <p:confirm header="Confirmar" message="Aprovar esta inscrição?" icon="pi pi-check"/>
                            </p:commandButton>

                            <p:commandButton icon="pi pi-times-circle"
                                             title="Indeferir"
                                             styleClass="ui-button-danger"
                                             update="formTriagem dialogIndeferimento"
                                             ajax="true"
                                             rendered="#{inscricao.situacao != 'I' and inscricao.situacao != 'A'}"
                                             oncomplete="PF('dlgIndeferimento').show()"
                                             actionListener="#{triagemBolsistaBean.setSelecionada(inscricao)}"/>
                        </p:column>
                    </p:dataTable>

                    <p:confirmDialog global="true" showEffect="fade">
                        <p:commandButton value="Confirmar" type="button" styleClass="ui-confirmdialog-yes"/>
                        <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/>
                    </p:confirmDialog>

                    <!-- Dialog de indeferimento -->
                    <p:dialog id="dialogIndeferimento" header="Motivo do Indeferimento"
                              widgetVar="dlgIndeferimento" modal="true" width="480">
                        <div class="field" style="padding: 1rem;">
                            <p:outputLabel for="motivoInd" value="Informe o motivo (será enviado ao bolsista):"/>
                            <p:inputTextarea id="motivoInd"
                                             value="#{triagemBolsistaBean.motivoIndeferimento}"
                                             rows="4" style="width: 100%; margin-top: 0.5rem;"
                                             maxlength="500"/>
                            <div style="margin-top: 1rem; text-align: right;">
                                <p:commandButton value="Confirmar Indeferimento"
                                                 action="#{triagemBolsistaBean.indeferir}"
                                                 icon="pi pi-times-circle"
                                                 styleClass="ui-button-danger"
                                                 update="formTriagem"
                                                 ajax="true"
                                                 oncomplete="if(!args.validationFailed) PF('dlgIndeferimento').hide()"/>
                                <p:commandButton value="Cancelar"
                                                 type="button"
                                                 icon="pi pi-times"
                                                 styleClass="ui-button-secondary"
                                                 style="margin-left: 0.5rem;"
                                                 onclick="PF('dlgIndeferimento').hide()"/>
                            </div>
                        </div>
                    </p:dialog>

                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
