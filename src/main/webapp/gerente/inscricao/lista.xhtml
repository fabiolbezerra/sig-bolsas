<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Inscrições no Edital
    </ui:define>

    <ui:define name="content">
        <h1>Inscrições no Edital XXXXX</h1>

        <!--TODO Dados do Edital-->
        <br/>

        <h:form id="formInscricao">
            <p:growl showDetail="true" showSummary="true"/>

            <p:dataTable value="#{inscricaoBean.inscricoes}"
                         var="inscricao"
                         emptyMessage="Nenhuma inscrição encontrada"
                         paginator="true"
                         rows="10"
                         paginatorPosition="bottom">

                <p:column headerText="Pesquisador">
                    <h:outputText value="#{inscricao.pessoa.nomeCompleto}" />
                </p:column>

                <p:column headerText=" ">
                    <p:commandButton value="Planos de trabalho"
                                     action="/pesquisador/plano/lista-pesquisador.xhtml" icon="fa fa-search"
                                     styleClass="ui-button-danger"
                                     update="@form"
                                     ajax="true">
                        <f:param name="editalID" value="#{inscricao.edital.id}"/>
                        <f:param name="pesquisadorID" value="#{papelBean.usuarioLogado.id}"/>
                        <f:param name="inscricaoID" value="#{inscricao.id}"/>
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

    </ui:define>

</ui:composition>
