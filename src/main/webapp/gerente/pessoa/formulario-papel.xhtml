<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">Alterar Permissão</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-shield"></i>
                    Alterar Permissão
                </h1>

                <p:button outcome="lista.xhtml"
                          value="Cancelar"
                          icon="pi pi-times"
                          styleClass="ui-button-secondary outline"/>
            </div>

            <div class="content-card">
                <h:form id="formPessoa">
                    <p:growl showDetail="true" showSummary="true"/>

                    <h:inputHidden value="#{pessoaBean.pessoa.id}"/>

                    <!-- Dados da Pessoa -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-user"></i>
                            Dados da Pessoa
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Nome Completo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{pessoaBean.pessoa.nomeCompleto}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Telefone"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{pessoaBean.pessoa.telefone}" converter="telefoneConverter"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="E-mail"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{pessoaBean.pessoa.email}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Data de Nascimento"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{pessoaBean.pessoa.nascimento}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <!-- Papéis e Permissões -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-check-square"></i>
                            Papéis e Permissões
                        </h2>
                        <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 8px; border: 1px solid #e9ecef;">
                            <p:outputLabel value="Selecione os papéis para esta pessoa:"
                                           style="display: block; margin-bottom: 1rem; font-weight: 600; color: #495057;"/>
                            <p:selectManyCheckbox value="#{pessoaBean.papeis}"
                                                  converter="papelConverter"
                                                  layout="grid"
                                                  columns="2">
                                <f:selectItems value="#{papelBean.papeis}"
                                               var="papel"
                                               itemLabel="#{papel.nome}"
                                               itemValue="#{papel}"/>
                            </p:selectManyCheckbox>
                        </div>
                    </div>

                    <!-- Confirmação de Senha -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-lock"></i>
                            Confirmação de Segurança
                        </h2>
                        <div style="max-width: 400px;">
                            <p:outputLabel for="senha" value="Digite sua senha para confirmar"
                                           style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.5rem; font-weight: 600;"/>
                            <p:password id="senha"
                                        value="#{pessoaBean.senha}"
                                        required="true"
                                        requiredMessage="A senha é obrigatória para confirmar a alteração"
                                        style="width: 100%;"/>
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <p:commandButton value="Alterar Permissão"
                                         action="#{pessoaBean.alterarPermissao()}"
                                         update="@form"
                                         icon="pi pi-check"
                                         styleClass="ui-button-success"/>
                        <p:button outcome="lista.xhtml"
                                  value="Cancelar"
                                  icon="pi pi-times"
                                  styleClass="ui-button-secondary outline"/>
                    </div>
                </h:form>
            </div>
        </div>

        <style type="text/css">
            .info-group {
                background: #fff;
                padding: 0.5rem;
            }
        </style>
    </ui:define>
</ui:composition>
