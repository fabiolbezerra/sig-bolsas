<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Pessoas
    </ui:define>

    <ui:define name="content">
        <h1>Listagem de Pessoas</h1>

        <br/>

<!--       //<p:link value="Nova pessoa" outcome="formulario.xhtml"/>-->

        <br/><br/>

        <h:form id="formPessoa">
            <p:growl showDetail="true" showSummary="true"/>

            <p:panelGrid columns="2">
                <f:facet name="header">
                    Critério de Pesquisa
                </f:facet>

                <f:facet name="footer">
                    <p:commandButton value="Buscar" action="#{pessoaBean.pesquisar()}" update="@form"
                                     icon="fa fa-search"/>
                </f:facet>

                <p:selectOneMenu value="#{pessoaBean.criterio}">
                    <f:selectItem itemValue="N" itemLabel="Nome Completo"/>
                    <f:selectItem itemValue="E" itemLabel="E-mail"/>
                    <f:selectItem itemValue="D" itemLabel="Data de Nascimento"/>

                </p:selectOneMenu>

                <p:inputText value="#{pessoaBean.chaveDeBusca}" placeholder="Digite a pista de pesquisa"/>
            </p:panelGrid>

            <br/><br/>

            <p:dataTable value="#{pessoaBean.pessoas}" var="pessoa"
                         emptyMessage="Nenhuma informação a ser exibida"
                         paginator="true" rows="10" paginatorPosition="bottom">
                <p:column headerText="Nome Completo">
                    <h:outputText value="#{pessoa.nomeCompleto}"/>
                </p:column>

                <p:column headerText="Telefone">
                    <h:outputText value="#{pessoa.telefone}" converter="telefoneConverter"/>
                </p:column>

                <p:column headerText="E-mail">
                    <h:outputText value="#{pessoa.email}"/>
                </p:column>

                <p:column headerText="Nascimento">
                    <h:outputText value="#{pessoa.nascimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">

                    <p:splitButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-info-circle">
                        <f:param name="pessoa" value="#{pessoa.id}"/>

                        <p:menuitem value="Editar" action="formulario.xhtml" icon="fa fa-pencil-square-o">
                            <f:param name="pessoa" value="#{pessoa.id}"/>
                        </p:menuitem>

                        <p:menuitem value="Senha" action="formulario-senha.xhtml" icon="fa fa-unlock-alt"
                                    aria-hidden="true">
                            <f:param name="pessoa" value="#{pessoa.id}"/>
                        </p:menuitem>

                        <p:menuitem value="E-mail" action="formulario-email.xhtml" icon="fa fa-envelope"
                                    aria-hidden="true">
                            <f:param name="pessoa" value="#{pessoa.id}"/>
                        </p:menuitem>
                        <p:menuitem title="Alterar os papéis (permissões)"
                                    value="Permissão"
                                    action="formulario-papel.xhtml" icon="fa fa-check-circle" aria-hidden="true">
                            <f:param name="pessoa" value="#{pessoa.id}"/>
                        </p:menuitem>
                    </p:splitButton>
                </p:column>
            </p:dataTable>
            <br/>
        </h:form>

    </ui:define>

</ui:composition>
