<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Plano de Trabalho
    </ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-file-o"></i>
                    Listagem de Planos de Trabalho
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formPlanoDeTrabalho">
                    <p:growl showDetail="true" showSummary="true"/>

                    <div style="margin-bottom: 2rem; background: #f8f9fa; padding: 1.5rem; border-radius: 8px; border: 1px solid #e9ecef;">
                        <div style="display: flex; gap: 1rem; align-items: flex-end;">
                            <div style="flex: 1;">
                                <p:outputLabel value="Critério de Pesquisa"
                                               style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #495057;"/>
                                <p:selectOneMenu value="#{planoDeTrabalhoBean.criterio}" style="width: 100%;">
                                    <f:selectItem itemValue="T" itemLabel="Título"/>
                                    <f:selectItem itemValue="R" itemLabel="Resumo"/>
                                    <f:selectItem itemValue="P" itemLabel="Nome Completo"/>
                                </p:selectOneMenu>
                            </div>
                            <div style="flex: 2;">
                                <p:outputLabel value="Palavra-chave"
                                               style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #495057;"/>
                                <p:inputText value="#{planoDeTrabalhoBean.chaveDeBusca}"
                                             placeholder="Digite sua pesquisa..." style="width: 100%;"/>
                            </div>
                            <p:commandButton value="Buscar" action="#{planoDeTrabalhoBean.pesquisar()}" update="@form"
                                             icon="pi pi-search" styleClass="ui-button-primary" style="height: 34px;"/>
                        </div>
                    </div>

                    <p:dataTable value="#{planoDeTrabalhoBean.planosDeTrabalho}" var="plano"
                                 emptyMessage="Nenhum plano encontrado"
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Título">
                            <h:outputText value="#{plano.titulo}" style="font-weight: bold; color: #2c3e50;"/>
                        </p:column>

                        <p:column headerText="Edital">
                            <h:outputText value="#{plano.inscricao.edital.titulo}"/>
                        </p:column>

                        <p:column headerText="Pesquisador">
                            <h:outputText value="#{plano.inscricao.pessoa.nomeCompleto}"/>
                        </p:column>

                        <p:column headerText="Telefone" style="text-align: center;">
                            <h:outputText value="#{plano.inscricao.pessoa.telefone}" converter="telefoneConverter"/>
                        </p:column>

                        <p:column headerText="E-mail">
                            <h:outputText value="#{plano.inscricao.pessoa.email}"/>
                        </p:column>

                        <p:column headerText="Data Cadastro" style="text-align: center;">
                            <h:outputText value="#{plano.dataCadastro}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Operações" style="text-align: center; width: 120px;">
                            <p:commandButton value="Detalhes" action="/bolsista/plano/detalhes.xhtml"
                                             icon="pi pi-info-circle">
                                <f:param name="planoID" value="#{plano.id}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
