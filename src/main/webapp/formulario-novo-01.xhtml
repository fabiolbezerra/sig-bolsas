<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
>

    <ui:define name="title">
        Novo Usuário
    </ui:define>

    <ui:define name="top">
        <h2></h2>
    </ui:define>

    <ui:define name="content">

        <!-- CSS Exclusivo para centralizar a tela de cadastro -->

        <div class="login-container">
            <div class="login-card ui-fluid">

                <div class="login-logo">
                    <h2>SIG Bolsas</h2>
                    <p style="color: #6c757d;">Criar nova conta</p>
                </div>

                <h:form id="formAutoCastro">
                    <p:growl id="growl" showDetail="true" showSummary="true"/>

                    <div class="p-field" style="margin-bottom: 1.5rem;">
                        <div class="ui-inputgroup">
                            <span class="ui-inputgroup-addon"><i class="pi pi-envelope"></i></span>
                            <p:inputText id="email" value="#{autoCadastroBean.email}"
                                         placeholder="Digite seu e-mail"
                                         required="true"
                                         style="width: 100%"/>
                        </div>
                    </div>

                    <p:commandButton value="CRIAR CONTA"
                                     action="#{autoCadastroBean.gerarCodigo()}"
                                     update="@form"
                                     style="width: 100%; height: 40px; background: #28a745; color: white; border: none; font-weight: bold;"/>

                    <div class="login-footer">
                        <p:link value="Já tem conta? Faça login" outcome="index.xhtml"
                                style="color: #007ad9; font-weight: bold;"/>
                    </div>

                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
