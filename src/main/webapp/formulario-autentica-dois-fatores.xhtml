<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Verificação em Dois Fatores</ui:define>

    <ui:define name="content">
        <div class="page-container" style="max-width: 480px; margin: 4rem auto;">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-shield"></i>
                    Verificação em Dois Fatores
                </h1>
            </div>

            <div class="content-card">
                <h:form id="form2FA">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p style="color: #555; margin-bottom: 1.5rem; text-align: center;">
                        Um código de 6 dígitos foi enviado para
                        <strong>#{autenticaDoisFatoresBean.emailPendente}</strong>.
                        Ele expira em 10 minutos.
                    </p>

                    <div class="field" style="margin-bottom: 1.5rem;">
                        <p:outputLabel for="codigo" value="Código de verificação" styleClass="field-label"/>
                        <p:inputText id="codigo"
                                     value="#{autenticaDoisFatoresBean.codigoDigitado}"
                                     maxlength="6"
                                     style="width:100%; letter-spacing: 0.5rem; font-size: 1.5rem; text-align:center;"
                                     placeholder="000000"
                                     required="true"
                                     requiredMessage="Informe o código recebido por e-mail."/>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
                        <p:commandButton value="Confirmar"
                                         action="#{autenticaDoisFatoresBean.validar}"
                                         icon="pi pi-check"
                                         styleClass="ui-button-success"
                                         style="min-width: 160px;"/>
                        <p:commandButton value="Reenviar código"
                                         action="#{autenticaDoisFatoresBean.reenviarCodigo}"
                                         icon="pi pi-refresh"
                                         styleClass="ui-button-secondary"
                                         ajax="true"
                                         update="form2FA"/>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
