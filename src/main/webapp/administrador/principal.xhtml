<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui"
>

    <ui:define name="title">
        Página Inicial do Administrador
    </ui:define>


    <ui:define name="content">
        <p:card style="max-width: 900px; margin: 0 auto;">
            <f:facet name="title">Página Inicial do Administrador</f:facet>
            <p:panelGrid columns="3" layout="grid" styleClass="p-mt-3" columnClasses="p-pr-2,p-pr-2,p-pr-2">
                <p:linkButton value="Comitês" outcome="/gerente/comite/lista" icon="pi pi-sitemap"/>
                <p:linkButton value="Comitês Vigentes" outcome="/coordenador/comite/lista-vigentes" icon="pi pi-check-circle"/>
                <p:linkButton value="Comitês Encerrados" outcome="/coordenador/comite/lista-encerrados" icon="pi pi-times"/>
                <p:linkButton value="Editais" outcome="/gerente/edital/lista" icon="pi pi-file"/>
                <p:linkButton value="Editais Abertos" outcome="/bolsista/edital/lista-abertos.xhtml" icon="pi pi-folder-open"/>
                <p:linkButton value="Editais Encerrados" outcome="/gerente/edital/lista-encerrados.xhtml" icon="pi pi-folder"/>
                <p:linkButton value="Papéis" outcome="/administrador/papel/lista" icon="pi pi-users"/>
                <p:linkButton value="Pessoas" outcome="/gerente/pessoa/lista" icon="pi pi-user"/>
                <p:linkButton value="Planos de Trabalho" outcome="/gerente/plano/lista.xhtml" icon="pi pi-briefcase"/>
                <p:linkButton value="Unidades Administrativas" outcome="/gerente/unidade/lista.xhtml" icon="pi pi-building"/>
                <h:panelGroup rendered="#{papelBean.usuarioLogadoPesquisador}">
                    <p:linkButton value="Minhas Inscrições" outcome="/pesquisador/inscricao/lista.xhtml" icon="pi pi-list"/>
                </h:panelGroup>
            </p:panelGrid>
        </p:card>
    </ui:define>

</ui:composition>
