<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Papéis
    </ui:define>

    <ui:define name="content">

        <h1>Papéis</h1>

        <br/><br/>

        <h:form id="formPapel">

            <p:growl showDetail="true" showSummary="true"/>

            <p:dataTable value="#{papelBean.papeis}" var="papel">
                <p:column headerText="Nome">
                    <h:outputText value="#{papel.nome}"/>
                </p:column>

                <p:column headerText="Código">
                    <h:outputText value="#{papel.codigo}"/>
                </p:column>

                <p:column headerText="Operações">
                    <p:splitButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-info-circle">
                        <f:setPropertyActionListener value="#{papel}" target="#{papelBean.papel}"/>
                    </p:splitButton>
                </p:column>
            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
