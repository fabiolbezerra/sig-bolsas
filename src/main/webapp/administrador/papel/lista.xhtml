<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Papéis
    </ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-key"></i>
                    Listagem de Papéis (Permissões)
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formPapel">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{papelBean.papeis}" var="papel"
                                 emptyMessage="Nenhuma informação a ser exibida"
                                 paginator="true" rows="10" paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Nome" priority="1">
                            <h:outputText value="#{papel.nome}" style="font-weight: 600; color: #2c3e50;"/>
                        </p:column>

                        <p:column headerText="Código" priority="2">
                            <h:outputText value="#{papel.codigo}"/>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column" priority="1">
                            <p:commandButton value="Detalhes" action="detalhes.xhtml"
                                             icon="pi pi-info-circle" styleClass="ui-button-outlined">
                                <f:setPropertyActionListener value="#{papel}" target="#{papelBean.papel}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
