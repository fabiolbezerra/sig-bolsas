<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">
        Detalhes de um papel
    </ui:define>

    <ui:define name="content">
        <h1>#{papelBean.papel.nome}</h1>

        <h:form id="formPessoa">

            <h2>Pessoas com o papel</h2>

            <p:dataList value="#{papelBean.papel.pessoaPapels}" var="p">
                <h:outputText value="#{p.pessoa.nomeCompleto}" />
            </p:dataList>

            <br/>

            <p:commandLink value="Voltar" action="lista.xhtml" />
        </h:form>
    </ui:define>
</ui:composition>
