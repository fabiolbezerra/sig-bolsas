<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Detalhes
    </ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-info-circle"></i>
                    #{editalBean.edital.titulo}
                </h1>
                <p:commandButton value="Voltar" action="#{editalBean.voltar()}" icon="pi pi-arrow-left"
                                 styleClass="ui-button-secondary outline"/>
            </div>

            <div class="content-card">
                <h:form id="formTitulo">
                    <p:growl showDetail="true" showSummary="true"/>

                    <!-- Informações do Edital -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-file"></i>
                            Dados do Edital
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Ano / Número"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{editalBean.edital.ano} / #{editalBean.edital.numero}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Situação"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{editalBean.obterSituacao(editalBean.edital.situacao)}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Tipo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{editalBean.obterTipo(editalBean.edital.tipo)}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Período de Inscrições"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{editalBean.edital.dataInicio}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                                <span style="margin: 0 0.3rem; color: #adb5bd;">a</span>
                                <h:outputText value="#{editalBean.edital.dataFinal}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; margin-bottom: 2rem;">
                        <!-- Formulário de Inscrição -->
                        <p:panel header="Formulário de Inscrição" styleClass="custom-panel">
                            <f:facet name="header">
                                <i class="pi pi-list" style="margin-right: 0.5rem;"></i>
                                Formulário de Inscrição
                            </f:facet>
                            <div style="padding: 1.5rem;">
                                <div class="info-group" style="margin-bottom: 1rem;">
                                    <p:outputLabel value="Nome"
                                                   style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                    <h:outputText value="#{editalBean.edital.formulario.nome}"
                                                  style="font-weight: 600;"/>
                                </div>
                                <div class="info-group" style="margin-bottom: 1rem;">
                                    <p:outputLabel value="Número de perguntas"
                                                   style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                    <h:outputText value="#{editalBean.edital.formulario.perguntas.size()}"
                                                  style="font-weight: 600;"/>
                                </div>
                                <div class="info-group">
                                    <p:outputLabel value="Data de criação"
                                                   style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                    <h:outputText value="#{editalBean.edital.formulario.dataCriacao}"
                                                  style="font-weight: 600;">
                                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                                    </h:outputText>
                                </div>
                            </div>
                        </p:panel>

                        <!-- Coordenador e Comitê -->
                        <p:panel header="Responsáveis" styleClass="custom-panel">
                            <f:facet name="header">
                                <i class="pi pi-users" style="margin-right: 0.5rem;"></i>
                                Responsáveis
                            </f:facet>
                            <div style="padding: 1.5rem;">
                                <div class="info-group" style="margin-bottom: 1.5rem;">
                                    <p:outputLabel value="Coordenador"
                                                   style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                    <h:outputText value="#{editalBean.edital.coordenador.nomeCompleto}"
                                                  style="font-weight: 600;"/>
                                </div>
                                <div class="info-group">
                                    <p:outputLabel value="Comitê de Avaliação"
                                                   style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                    <h:outputText value="#{editalBean.edital.comite.portaria}"
                                                  style="font-weight: 600; display: block; margin-bottom: 0.5rem;"/>

                                    <p:dataTable value="#{editalBean.edital.comite.comitePessoas}" var="p"
                                                 emptyMessage="Nenhum membro no comitê"
                                                 styleClass="ui-datatable-sm">
                                        <p:column headerText="Membros">
                                            <h:outputText value="#{p.pessoa.nomeCompleto}"/>
                                        </p:column>
                                    </p:dataTable>
                                </div>
                            </div>
                        </p:panel>
                    </div>
                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
