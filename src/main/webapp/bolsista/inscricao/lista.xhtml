<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Minhas Inscrições</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-list"></i>
                    Minhas Inscrições
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formPlanos">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{planoDeTrabalhoBean.obterPorBolsista(papelBean.usuarioLogado.id)}"
                                 var="plano"
                                 emptyMessage="Você ainda não está inscrito em nenhum plano de trabalho"
                                 paginator="true"
                                 rows="10"
                                 paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Título" sortBy="#{plano.titulo}" priority="1">
                            <h:outputText value="#{plano.titulo}"/>
                        </p:column>

                        <p:column headerText="Pesquisador" sortBy="#{plano.inscricao.pessoa.nomeCompleto}" priority="2">
                            <h:outputText value="#{plano.inscricao.pessoa.nomeCompleto}"/>
                        </p:column>

                        <p:column headerText="Edital" sortBy="#{plano.inscricao.edital.titulo}" priority="3">
                            <h:outputText value="#{plano.inscricao.edital.titulo}"/>
                        </p:column>

                        <p:column headerText="Data Cadastro" sortBy="#{plano.dataCadastro}" styleClass="text-center"
                                  priority="4">
                            <h:outputText value="#{plano.dataCadastro}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Período do Edital" styleClass="text-center" priority="5">
                            <h:outputText value="#{plano.inscricao.edital.dataInicio}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                            <h:outputText value=" a "/>
                            <h:outputText value="#{plano.inscricao.edital.dataFinal}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column">
                            <p:commandButton value="Detalhes"
                                             icon="pi pi-info-circle"
                                             action="/bolsista/inscricao/detalhes.xhtml"
                                             styleClass="ui-button-info"
                                             ajax="false">
                                <f:param name="planoID" value="#{plano.id}"/>
                                <f:param name="bolsistaID" value="#{papelBean.usuarioLogado.id}"/>
                                <f:param name="inscricaoBolsistaID" value="#{papelBean.usuarioLogado.id}"/>
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
