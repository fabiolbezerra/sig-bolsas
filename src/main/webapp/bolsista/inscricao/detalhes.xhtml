<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <ui:define name="title">Detalhes da Inscrição</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-info-circle"></i>
                    Detalhes da Inscrição
                </h1>

                <p:button outcome="/bolsista/inscricao/lista.xhtml"
                          value="Voltar"
                          icon="pi pi-arrow-left"
                          styleClass="ui-button-secondary outline"/>
            </div>

            <div class="content-card">
                <h:form id="formInscricao">
                    <p:growl showDetail="true" showSummary="true"/>

                    <!-- Dados do Participante -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-user"></i>
                            Dados do Participante
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Nome Completo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.bolsista.nomeCompleto}"
                                              style="font-weight: 600; color: #212529; font-size: 1rem;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Telefone"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.bolsista.telefone}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Email"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.bolsista.email}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Data de Nascimento"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.bolsista.nascimento}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <!-- Dados do Edital -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-file"></i>
                            Dados do Edital
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Edital"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.edital.titulo}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Ano/Número"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText
                                        value="#{inscricaoBolsistaBean.edital.ano} / #{inscricaoBolsistaBean.edital.numero}"
                                        style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Situação"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText
                                        value="#{inscricaoBolsistaBean.obterSituacao(inscricaoBolsistaBean.edital.situacao)}"
                                        style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Tipo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText
                                        value="#{inscricaoBolsistaBean.obterTipo(inscricaoBolsistaBean.edital.tipo)}"
                                        style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Início das inscrições"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.edital.dataInicio}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Fim das inscrições"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.edital.dataFinal}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Cadastrado"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.edital.dataCadastro}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <!-- Dados da Inscrição -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-check-circle"></i>
                            Dados da Inscrição
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Protocolo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.inscricaoBolsista.protocolo}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Data de Inscrição"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBolsistaBean.inscricaoBolsista.dataInscricao}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>
                </h:form>
            </div>
        </div>

    </ui:define>

</ui:composition>
