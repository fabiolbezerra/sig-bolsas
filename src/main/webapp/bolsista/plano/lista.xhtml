<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Planos de Trabalho Disponíveis</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-clipboard"></i>
                    Planos de Trabalho Disponíveis
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formPlanoDeTrabalho">
                    <p:growl showDetail="true" showSummary="true"/>
                    <f:param name="bolsistaID" value="#{papelBean.usuarioLogado.id}"/>

                    <p:dataTable value="#{planoDeTrabalhoBean.obterPlanoDeTrabalhoVigentes()}"
                                 var="plano"
                                 emptyMessage="Nenhum plano de trabalho disponível"
                                 paginator="true"
                                 rows="10"
                                 paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Título" priority="1">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{plano.titulo}" style="font-weight: 600; color: #2c3e50;"/>
                                <h:outputText value="#{plano.inscricao.edital.titulo}"
                                              style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;"
                                              class="mobile-only"/>
                            </div>
                        </p:column>

                        <p:column headerText="Resumo" priority="3">
                            <h:outputText value="#{plano.resumo}"
                                          style="max-width: 300px; display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"/>
                        </p:column>

                        <p:column headerText="Edital" priority="2">
                            <h:outputText value="#{plano.inscricao.edital.titulo}"/>
                        </p:column>

                        <p:column headerText="Situação" priority="4">
                            <h:outputText
                                    value="#{inscricaoBolsistaBean.obterSituacao(plano.inscricao.edital.situacao)}"/>
                        </p:column>

                        <p:column headerText="Pesquisador" priority="3">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{plano.inscricao.pessoa.nomeCompleto}" style="font-weight: 500;"/>
                                <h:outputText value="#{plano.inscricao.pessoa.telefone}" converter="telefoneConverter"
                                              style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;"
                                              class="mobile-only"/>
                            </div>
                        </p:column>

                        <p:column headerText="Contato" priority="5">
                            <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                                <h:outputText value="#{plano.inscricao.pessoa.telefone}" converter="telefoneConverter"
                                              style="font-size: 0.9rem;"/>
                                <h:outputText value="#{plano.inscricao.pessoa.email}"
                                              style="font-size: 0.85rem; color: #666;"/>
                            </div>
                        </p:column>

                        <p:column headerText="Data Cadastro" priority="4" styleClass="text-center">
                            <h:outputText value="#{plano.dataCadastro}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Operações" styleClass="text-center action-column" priority="1">
                            <p:splitButton value="Inscrever-se"
                                           action="#{inscricaoBolsistaBean.iniciarInscricaoBolsista()}"
                                           icon="pi pi-user-plus"
                                           styleClass="split-action"
                                           ajax="false">
                                <f:param name="planoID" value="#{plano.id}"/>
                                <f:param name="bolsistaID" value="#{papelBean.usuarioLogado.id}"/>

                                <p:menuitem value="Detalhes"
                                            action="/bolsista/plano/detalhes.xhtml"
                                            icon="pi pi-info-circle">
                                    <f:param name="planoID" value="#{plano.id}"/>
                                </p:menuitem>
                            </p:splitButton>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
