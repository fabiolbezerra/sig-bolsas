<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
>

    <ui:define name="title">
        Reinicializar Senha
    </ui:define>

    <!-- Removemos o topo padrão para esta tela ficar limpa -->
    <ui:define name="top">
        <h2></h2>
    </ui:define>

    <ui:define name="content">

        <!-- CSS Exclusivo para centralizar a tela de recuperação de senha -->

        <div class="login-container">
            <div class="login-card ui-fluid">

                <div class="login-logo">
                    <h2>SIG Bolsas</h2>
                    <p style="color: #6c757d;">Recuperar senha</p>
                </div>

                <h:form id="formSenha">
                    <p:growl showDetail="true" showSummary="true"/>

                    <h:inputHidden value="#{pessoaBean.novoEmail}"/>

                    <div class="p-field" style="margin-bottom: 1.5rem;">
                        <div class="ui-inputgroup">
                            <span class="ui-inputgroup-addon"><i class="pi pi-envelope"></i></span>
                            <p:inputText id="email" value="#{pessoaBean.novoEmail}"
                                         placeholder="Digite seu e-mail cadastrado"
                                         required="true"
                                         validator="emailValidator"
                                         style="width: 100%"/>
                        </div>
                    </div>

                    <p:commandButton value="REDEFINIR SENHA"
                                     action="#{pessoaBean.enviarEmailRenicializacaoDeSenha()}"
                                     update="@form"
                                     style="width: 100%; height: 40px; background: #007ad9; color: white; border: none; font-weight: bold;"/>

                    <div class="login-footer">
                        <p:link value="Voltar para o login" outcome="index.xhtml"
                                style="color: #007ad9; font-weight: bold;"/>
                    </div>

                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
