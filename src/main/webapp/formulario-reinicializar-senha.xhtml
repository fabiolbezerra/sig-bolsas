<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Reinicializar Senha
    </ui:define>

    <ui:define name="content">
        <h1> Reinicializar Senha</h1>

        <br/>

        <h:form id="formSenha">
            <p:growl showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{pessoaBean.novoEmail}"/>

            <h:panelGrid columns="2">
                <p:outputLabel value="E-mail Cadastrado:" />
                <p:inputText value="#{pessoaBean.novoEmail}" style="width: 400px;"
                             validator="emailValidator" />
            </h:panelGrid>

            <p:button outcome="index.xhtml" value="Cancelar"/>
            <p:commandButton value="Redefinir Senha" action="#{pessoaBean.enviarEmailRenicializacaoDeSenha()}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
