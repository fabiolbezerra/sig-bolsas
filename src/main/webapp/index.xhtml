<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Login
    </ui:define>

    <ui:define name="top">
        <h2>Sistema de Gestão Bolsistas</h2>
    </ui:define>

    <ui:define name="content">
        <form id="formLogin"
              action="#{request.contextPath}/j_spring_security_check"
              method="post">

            <div align="center">
                <h3>Entrar no Sistema</h3>

                <hr width="15%"/>

                <h:outputText
                        value="E-mail ou senha inválidos"
                        rendered="#{param.get('e') != null}"
                        style="color: red; font-size: 1.2em; "/>

                <div class="ui-g-12">
                    <p:inputText id="j_username"
                                 placeholder="Email"
                                 required="true"/>
                </div>

                <div class="ui-g-12">
                    <p:password id="j_password"
                                placeholder="Senha"
                                required="true"
                                feedback="false"/>
                </div>

                <hr width="15%"/>

                <div class="ui-g-12">
                    <p:commandButton
                            onclick="#{request.contextPath} / j_spring_security_check;"
                            value="Acessar"
                            icon="fa fa-sign-in"
                            style="width: 120px">
                    </p:commandButton>
                </div>

                <hr width="15%"/>
                <p:link value="Esqueci minha senha" outcome="formulario-reinicializar-senha.xhtml"/> |
                <p:link value="Criar minha conta" outcome="formulario-novo-03.xhtml"/>


            </div>
        </form>
    </ui:define>

</ui:composition>
