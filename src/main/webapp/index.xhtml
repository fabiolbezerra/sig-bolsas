<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
   <title>Listagem de Pessoas</title>
</h:head>
<h:body>
   <h:form id="formPessoa">
      <p:growl showDetail="true" showSummary="true" />

      <h1>Pessoas</h1>


      <p:dataTable value="#{pessoaBean.pessoas}" var="a">
         <p:column headerText="Nome Completo">
            <h:outputText value="#{a.nomeCompleto}"/>
         </p:column>

         <p:column headerText="Telefone" filterBy="#{a.telefone}">
            <h:outputText value="#{a.telefone}"/>
         </p:column>

         <p:column headerText="E-mail" filterBy="#{a.email}">
            <h:outputText value="#{a.email}"/>
         </p:column>

         <p:column headerText="Nascimento">
            <h:outputText value="#{a.nascimento}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </h:outputText>
         </p:column>
      </p:dataTable>
   </h:form>
</h:body>
</html>
