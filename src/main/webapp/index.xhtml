<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <ui:define name="title">
        Login
    </ui:define>

    <!-- Removemos o topo padrão para esta tela ficar limpa -->
    <ui:define name="top">
        <h2></h2>
    </ui:define>

    <ui:define name="content">

        <!-- CSS Exclusivo para centralizar a tela de login -->
        <style>
            .login-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 90vh; /* Ocupa quase toda a altura da tela */
            }
            .login-card {
                background-color: white;
                padding: 2rem;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                width: 100%;
                max-width: 400px; /* Largura máxima do cartão */
            }
            .login-logo {
                text-align: center;
                margin-bottom: 2rem;
                color: #495057;
            }
            .login-footer {
                text-align: center;
                margin-top: 1.5rem;
                font-size: 0.9em;
            }
        </style>

        <div class="login-container">
            <div class="login-card ui-fluid">

                <div class="login-logo">
                    <!-- Se tiver uma logo, coloque aqui: <h:graphicImage name="images/logo.png" /> -->
                    <h2>SIG Bolsas</h2>
                    <p style="color: #6c757d;">Bem-vindo de volta</p>
                </div>

                <form id="formLogin"
                      action="#{request.contextPath}/j_spring_security_check"
                      method="post">

                    <!-- Mensagem de erro estilizada -->
                    <p:outputPanel rendered="#{param.get('e') != null}" styleClass="ui-message ui-message-error ui-widget ui-corner-all" style="width: 100%; margin-bottom: 1rem; display: block;">
                        <span class="ui-message-error-icon"></span>
                        <span class="ui-message-error-detail">Usuário ou senha inválidos.</span>
                    </p:outputPanel>

                    <div class="p-field" style="margin-bottom: 1rem;">
                        <div class="ui-inputgroup">
                            <span class="ui-inputgroup-addon"><i class="pi pi-user"></i></span>
                            <input id="j_username"
                                   name="j_username"
                                   type="text"
                                   placeholder="E-mail"
                                   required="required"
                                   class="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all"
                                   style="width: 100%"/>
                        </div>
                    </div>

                    <div class="p-field" style="margin-bottom: 1.5rem;">
                        <div class="ui-inputgroup">
                            <span class="ui-inputgroup-addon"><i class="pi pi-lock"></i></span>
                            <input id="j_password"
                                   name="j_password"
                                   type="password"
                                   placeholder="Senha"
                                   required="required"
                                   class="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all"
                                   style="width: 100%"/>
                        </div>
                    </div>

                    <button type="submit"
                            class="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only"
                            style="width: 100%; height: 40px; background: #007ad9; color: white; border: none; font-weight: bold; cursor: pointer;">
                        <span class="ui-button-text ui-c">ENTRAR</span>
                    </button>

                    <div class="login-footer">
                        <p:link value="Esqueci minha senha" outcome="formulario-reinicializar-senha.xhtml" style="display: block; margin-bottom: 5px; color: #007ad9;"/>
                        <p:link value="Não tem conta? Cadastre-se" outcome="formulario-novo-01.xhtml" style="color: #6c757d; font-weight: bold;"/>
                    </div>

                </form>
            </div>
        </div>

    </ui:define>

</ui:composition>
