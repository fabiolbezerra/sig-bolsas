<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <ui:define name="title">
        Login
    </ui:define>

    <ui:define name="top">
        <h2>Sistema de Gestão Bolsistas</h2>
    </ui:define>

    <ui:define name="content">
        <form id="formLogin"
              action="#{request.contextPath}/j_spring_security_check"
              method="post">

            <div align="center">
                <h3>Entrar no Sistema</h3>

                <hr width="15%"/>

                <h:outputText
                        value="E-mail ou senha inválidos"
                        rendered="#{param.get('e') != null}"
                        style="color: #1e1f22; font-size: 1.2em; "/>

                <div class="ui-g-12">
                    <input id="j_username"
                           name="j_username"
                           type="text"
                           placeholder="Email"
                           required="required"
                           class="p-inputtext p-component"/>
                </div>

                <div class="ui-g-12">
                    <input id="j_password"
                           name="j_password"
                           type="password"
                           placeholder="Senha"
                           required="required"
                           class="p-inputtext p-component"/>
                </div>

                <hr width="15%"/>

                <div class="ui-g-12">
                    <button type="submit" class="p-button p-component" style="width: 120px">
                        <span class="p-button-icon pi pi-sign-in"></span>
                        <span class="p-button-label">Acessar</span>
                    </button>
                </div>

                <hr width="15%"/>
                <p:link value="Esqueci minha senha" outcome="formulario-reinicializar-senha.xhtml"/> |
                <p:link value="Criar minha conta" outcome="formulario-novo-01.xhtml"/>


            </div>
        </form>
    </ui:define>

</ui:composition>
