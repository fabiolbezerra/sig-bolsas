<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Cadastro de Pessoa
    </ui:define>

    <ui:define name="content">
        <h1>Pessoa</h1>
        <h:form id="formPessoa">
            <p:growl showDetail="true" showSummary="true"/>


            <h:inputHidden value="#{pessoaBean.pessoa.id}"/>
            <h:inputHidden value="#{pessoaBean.pessoa.senha}"/>
            <h:panelGrid columns="2">
                <p:outputLabel value="Nome completo"/>
                <p:inputText value="#{pessoaBean.pessoa.nomeCompleto}"
                             validator="nomeCompletoValidator"/>

                <p:outputLabel value="Telefone"/>
                <p:inputMask mask="(99) 99999-9999"
                             value="#{pessoaBean.pessoa.telefone}"
                             converter="telefoneConverter"/>

                <p:outputLabel value="E-mail"/>
                <p:inputText value="#{pessoaBean.pessoa.email}"
                             validator="emailValidator" />

                <p:outputLabel value="Senha" rendered="#{pessoaBean.pessoa.id == null}"/>
                <p:password id="senha1"
                            value="#{pessoaBean.pessoa.senha}"
                            match="senha2"
                            rendered="#{pessoaBean.pessoa.id == null}"/>

                <p:outputLabel value="Redigite a Senha" rendered="#{pessoaBean.pessoa.id == null}"/>
                <p:password id="senha2"
                            value="#{pessoaBean.senha}"
                            rendered="#{pessoaBean.pessoa.id == null}"/>

                <p:outputLabel value="Data de nascimento"/>
                <p:calendar pattern="dd/MM/yyyy" value="#{pessoaBean.pessoa.nascimento}"/>
            </h:panelGrid>

            <p:button outcome="lista.xhtml" value="Cancelar"/>
            <p:commandButton value="Salvar" action="#{pessoaBean.salvar()}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
