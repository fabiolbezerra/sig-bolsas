<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Pessoas
    </ui:define>

    <ui:define name="content">
        <h1>Listagem de Pessoas</h1>

        <br/>

        <p:link value="Inicio" outcome="/pesquisador/principal.xhtml"/> |
        <p:link value="Nova pessoa" outcome="formulario.xhtml"/>

        <br/><br/>

        <h:form id="formPessoa">
            <p:growl showDetail="true" showSummary="true"/>

            <p:toolbar>
                <f:facet name="left">
                    <p:inputText placeholder="Chave de busca..."
                                 size="30" value="#{pessoaBean.termoPesquisa}"/>
                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>
                    <p:commandButton value="Buscar" icon="fa fa-search"
                                     actionListener="#{pessoaBean.buscarPessoa()}" update="pessoasDataTable"/>

                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>
                    <p:outputLabel value=" "/>
                    <p:selectOneMenu value="#{pessoaBean.campoTabela}">
                        <f:selectItem itemValue="nomeCompleto" itemLabel="Nome Completo"/>
                        <f:selectItem itemValue="telefone" itemLabel="Telefone"/>
                        <f:selectItem itemValue="email" itemLabel="E-mail"/>
                        <f:selectItem itemValue="nascimento" itemLabel="Data de Nascimento"/>
                    </p:selectOneMenu>
                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>


                </f:facet>
            </p:toolbar>

            <p:spacer height="20px" />


            <p:dataTable id="pessoasDataTable" value="#{pessoaBean.pessoas}" var="pessoa"
                         emptyMessage="Nenhuma informação a ser exibida"
                         paginator="true" rows="10" paginatorPosition="bottom">
            <p:column headerText="Nome Completo">
                    <h:outputText value="#{pessoa.nomeCompleto}"/>
                </p:column>

                <p:column headerText="Telefone">
                    <h:outputText value="#{pessoa.telefone}" converter="telefoneConverter"/>
                </p:column>

                <p:column headerText="E-mail">
                    <h:outputText value="#{pessoa.email}"/>
                </p:column>

                <p:column headerText="Nascimento">
                    <h:outputText value="#{pessoa.nascimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">

                    <p:splitButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-search">
                        <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>

                        <p:menuitem value="Editar" action="formulario.xhtml" icon="fa fa-pencil">
                            <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                        </p:menuitem>

                        <p:menuitem value="Senha" action="formulario-senha.xhtml" icon="fa fa-unlock-alt" aria-hidden="true">
                            <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                        </p:menuitem>

                        <p:menuitem value="E-mail" action="formulario-email.xhtml" icon="fa fa-envelope" aria-hidden="true">
                            <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                        </p:menuitem>
                        <p:menuitem title="Alterar os papéis (permissões)"
                                    value="Permissão"
                                    action="formulario-papel.xhtml" icon="fa fa-check-circle" aria-hidden="true">
                            <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                        </p:menuitem>
                    </p:splitButton>
                </p:column>
            </p:dataTable>
            <br/>

            <p:link value="Inicio" outcome="/pesquisador/principal.xhtml"/>

        </h:form>

    </ui:define>

</ui:composition>
