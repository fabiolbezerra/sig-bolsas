<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Listagem de Pessoas
    </ui:define>

    <ui:define name="content">
        <h2>Listagem de pessoas</h2>

        <h:form id="formPessoa">
            <p:growl showDetail="true" showSummary="true"/>

            <p:link value="Voltar" outcome="/pesquisador/principal.xhtml"/> | <p:link value="Cadastrar pessoa" outcome="formulario.xhtml"/>

             <br/><br/>

            <p:dataTable value="#{pessoaBean.pessoas}" var="pessoa">
                <p:column headerText="Nome Completo">
                    <h:outputText value="#{pessoa.nomeCompleto}"/>
                </p:column>

                <p:column headerText="Telefone">
                    <h:outputText value="#{pessoa.telefone}"/>
                </p:column>

                <p:column headerText="E-mail">
                    <h:outputText value="#{pessoa.email}"/>
                </p:column>

                <p:column headerText="Nascimento">
                    <h:outputText value="#{pessoa.nascimento}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">
                    <p:commandLink value="Editar" action="formulario.xhtml">
                        <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                    </p:commandLink>
                    |
                    <p:commandLink value="Detalhes" action="detalhes.xhtml">
                        <f:setPropertyActionListener value="#{pessoa}" target="#{pessoaBean.pessoa}"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>
            <br/>

            <p:commandLink value="Voltar" action="/pesquisador/principal.xhtml"/>

        </h:form>

    </ui:define>

</ui:composition>
