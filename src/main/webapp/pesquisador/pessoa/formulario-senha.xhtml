<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Alterar Senha
    </ui:define>

    <ui:define name="content">
        <h1>Alterar Senha</h1>

        <br/>

        <h:form id="formPessoa">
            <p:growl autoUpdate="true" showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{pessoaBean.pessoa.email}"/>

            <h:panelGrid columns="2">
                <p:outputLabel value="Nome completo"/>
                <h:outputText value="#{pessoaBean.pessoa.nomeCompleto}"/>

                <p:outputLabel value="Telefone"/>
                <h:outputText value="#{pessoaBean.pessoa.telefone}"/>

                <p:outputLabel value="E-mail"/>
                <h:outputText value="#{pessoaBean.pessoa.email}"/>

                <p:outputLabel value="Data de nascimento"/>
                <h:outputText value="#{pessoaBean.pessoa.nascimento}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>
            </h:panelGrid>

            <h:panelGrid columns="2">

                <p:outputLabel value="Senha Atual"/>
                <p:password id="senhaAtual"
                            value="#{pessoaBean.pessoa.senha}"/>

                <p:outputLabel value="Nova Senha"/>
                <p:password id="senha1"
                            value="#{pessoaBean.novaSenha}"
                            match="senha2"/>

                <p:outputLabel value="Redigite a Senha Nova"/>
                <p:password id="senha2"
                            value="#{pessoaBean.senha}"/>

            </h:panelGrid>

            <p:button outcome="lista.xhtml" value="Cancelar"/>
            <p:commandButton value="Alterar Senha" action="#{pessoaBean.alterarSenha()}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
