<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
>

    <ui:define name="title">Dashboard - Pesquisador</ui:define>

    <ui:define name="content">


        <div class="dashboard-container">

            <div class="dashboard-header">
                <h1>Painel do Pesquisador</h1>
                <p>Acesse editais e gerencie suas inscrições</p>
            </div>

            <!-- Seção: Minhas Ações -->
            <div class="dashboard-section">
                <div class="dashboard-section-title">
                    <i class="pi pi-user" style="margin-right: 0.5rem;"></i>
                    Minhas Ações
                </div>
                <div class="card-grid">
                    <h:link outcome="/bolsista/edital/lista-abertos.xhtml" styleClass="dashboard-card blue">
                        <span class="card-icon blue">
                            <i class="pi pi-folder-open"></i>
                        </span>
                        <h3 class="card-title">Editais Abertos</h3>
                        <p class="card-description">Consulte editais disponíveis para inscrição</p>
                    </h:link>

                    <h:link outcome="/pesquisador/inscricao/lista.xhtml" styleClass="dashboard-card green">
                        <span class="card-icon green">
                            <i class="pi pi-list"></i>
                        </span>
                        <h3 class="card-title">Minhas Inscrições</h3>
                        <p class="card-description">Acompanhe suas inscrições e planos de trabalho</p>
                    </h:link>
                </div>
            </div>

        </div>

    </ui:define>

</ui:composition>
