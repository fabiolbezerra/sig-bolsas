<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Papéis</title>
</h:head>
<h:body>
    <h1>Papéis</h1>

    <h:form id="formPapel">
        <p:growl showDetail="true" showSummary="true"/>

        <p:dataTable value="#{papelBean.papeis}" var="papel">
            <p:column headerText="Nome">
                <h:outputText value="#{papel.nome}"/>
            </p:column>

            <p:column headerText="Código">
                <h:outputText value="#{papel.codigo}"/>
            </p:column>

            <p:column headerText="Operações">
                <p:commandLink value="Detalhes" action="detalhes.xhtml" >
                    <f:setPropertyActionListener value="#{papel}" target="#{papelBean.papel}"/>
                </p:commandLink>
            </p:column>
        </p:dataTable>
    </h:form>
</h:body>
</html>
