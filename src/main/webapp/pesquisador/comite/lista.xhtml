<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="Comitês">
    </ui:define>

    <ui:define name="content">
        <h1> Listagem de Comitês </h1>
        <h:form id="formComite">
            <p:growl showDetail="true" showSummary="true"/>

        <p:commandLink value="Cadastrar comitê" action="formulario.xhtml" /> <br/><br/>
        <p:commandLink value="Voltar" action="/pesquisador/principal.xhtml"/> <br/><br/>

        <p:dataTable value="#{comiteBean.comites}" var="comite">
            <p:column headerText="Portaria">
                <h:outputText value="#{comite.portaria}" />
            </p:column>

            <p:column headerText="Início da vigência">
                <h:outputText value="#{comite.inicio}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Fim da vigência">
                <h:outputText value="#{comite.fim}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Cadastrado por">
                <h:outputText value="#{comite.coordenador.nomeCompleto}" />
            </p:column>

            <p:column headerText="Operações">
                <p:commandLink value="Editar" action="formulario.xhtml" >
                    <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>
                </p:commandLink>
                |
                <p:commandLink value="Detalhes" action="detalhes.xhtml" >
                    <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>
                </p:commandLink>
            </p:column>
        </p:dataTable>

            <br/>

            <p:commandLink value="Voltar" action="/pesquisador/principal.xhtml"/>
        </h:form>

    </ui:define>

</ui:composition>
