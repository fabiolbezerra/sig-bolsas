<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="Comitês">
        Comitês
    </ui:define>

    <ui:define name="content">
        <h1> Listagem de Comitês </h1>

        <br/>

        <p:link value="Início" outcome="/pesquisador/principal.xhtml"/> | <p:link value="Cadastrar Comitê"
                                                                                  outcome="formulario.xhtml"/>

        <br/> <br/>

        <h:form id="formComite">
            <p:growl showDetail="true" showSummary="true"/>
            <p:toolbar>
                <f:facet name="left">
                    <p:inputText placeholder="Chave de busca..."
                                 size="30" value="#{comiteBean.termoPesquisa}"/>
                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>

                    <p:outputLabel value=" "/>
                    <p:selectOneMenu value="#{comiteBean.campoTabela}">
                        <f:selectItem itemValue="portaria" itemLabel="Portaria"/>
                        <f:selectItem itemValue="inicio" itemLabel="Início da vigência"/>
                        <f:selectItem itemValue="fim" itemLabel="Fim da vigência"/>
                    </p:selectOneMenu>
                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>
                    <p:commandButton value="Buscar" icon="fa fa-search"
                                     actionListener="#{comiteBean.listarTodos()}" update="comitesDataTable"/>

                    <span class="ui-separator">
	                <span class="ui-icon ui-icon-grip-dotted-vertical" />
	            </span>
                </f:facet>
            </p:toolbar>

            <p:dataTable id="comitesDataTable" value="#{comiteBean.comites}" var="comite"
                emptyMessage="Nenhuma informação a ser exibida"
                paginator="true" rows="10" paginatorPosition="bottom"
                         widgetVar="comitesDataTable" filteredValue="#{comiteBean.listarTodos()}">
                <p:column headerText="Portaria" >
                    <h:outputText value="#{comite.portaria}"/>
                </p:column>

                <p:column headerText="Início da vigência" >
                    <h:outputText value="#{comite.inicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Fim da vigência" >
                    <h:outputText value="#{comite.fim}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Cadastrado por" >
                    <h:outputText value="#{comite.coordenador.nomeCompleto}"/>
                </p:column>

                <p:column headerText="Operações">
                    <p:splitButton value="Detalhes" icon="fa fa-search"
                                   oncomplete="PF('comiteDialogWidgetVar').show()"
                                   update=":formComite:comiteDialog" process="@this">
                        <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>

                        <p:menuitem value="Editar" action="formulario.xhtml" icon="fa fa-pencil">
                            <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>
                        </p:menuitem>
                    </p:splitButton>
                </p:column>
            </p:dataTable>

            <p:dialog id="comiteDialog" header="Detalhes do Comite" widgetVar="comiteDialogWidgetVar"
                      modal="true" resizable="false" closeOnEscape="true" closable="true"
                      width="800" height="600" styleClass="dialogo-estilizado">

            <!-- Título principal -->
                <h:panelGrid columns="1" styleClass="panelGridTituloForm">
                    <h1 class="titulo-principal">#{comiteBean.comite.portaria}</h1>
                </h:panelGrid>


                <!-- Painel de detalhes do edital -->
                <h:panelGrid id="editalPanelGrid" columns="1" styleClass="panelGridCorpo"
                             rendered="#{editalBean.edital ne null}">


                    <p:outputLabel value="Vigência" style="font-weight: bold;"/>
                    <p:outputLabel value="#{comiteBean.comite.inicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </p:outputLabel>
                    <p:outputLabel value=" a " />
                    <p:outputLabel value="#{comiteBean.comite.fim}">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </p:outputLabel>
                </h:panelGrid>

                <!-- membros -->
                <h:panelGrid columns="1" styleClass="panelGridCorpoForm">
                    <h1 class="titulo-secundario">Membros</h1>
                </h:panelGrid>
                <h:panelGrid columns="1" styleClass="panelGridCorpo" style="height: 80px;">
                    <p:dataList value="#{comiteBean.comite.comitePessoas}" var="membro" emptyMessage="Nenhum membro">
                        <h:outputText value="#{membro.pessoa.nomeCompleto}"/>
                    </p:dataList>
                </h:panelGrid>

                <!-- comitê cadastrado por -->
                <h:panelGrid columns="1" styleClass="panelGridCorpoForm">
                    <h1 class="titulo-secundario">Comitê cadastrado por</h1>
                </h:panelGrid>
                <h:panelGrid columns="1" styleClass="panelGridCorpo" style="height: 40px;">
                    <h:outputText value="#{comiteBean.comite.coordenador.nomeCompleto}"/>
                </h:panelGrid>

                <!-- Editais que o comitê atua -->
                <h:panelGrid columns="1" styleClass="panelGridCorpoForm">
                    <h1 class="titulo-secundario">Editais que o comitê atua</h1>
                </h:panelGrid>
                <h:panelGrid columns="1" styleClass="panelGridCorpo" style="height: 40px;">
                    <p:dataList value="#{comiteBean.comite.editals}" var="edital" emptyMessage="Nenhum edital">
                        <h:outputText value="#{edital.titulo} - #{edital.ano}/#{edital.numero}"/>
                    </p:dataList>
                </h:panelGrid>

                <h:panelGrid columns="1" styleClass="panelGridCorpo"
                             style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 15vh; ">

                </h:panelGrid>
                <h:panelGrid columns="1" styleClass="panelGridCorpo"
                             style="display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 5vh; ">
                    <p:commandButton value="Fechar" oncomplete="PF('comiteDialogWidgetVar').hide()" immediate="true"
                                     icon="pi pi-times"/>
                </h:panelGrid>
            </p:dialog>
            <br/>

            <p:link value="Início" outcome="/pesquisador/principal.xhtml"/>
        </h:form>

    </ui:define>

</ui:composition>
