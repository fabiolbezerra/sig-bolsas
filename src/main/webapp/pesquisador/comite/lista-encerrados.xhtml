<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Comitês Encerrados
    </ui:define>

    <ui:define name="content">
        <h1> Listagem de Comitês Encerrados</h1>

        <h:form id="formComite">
            <p:growl showDetail="true" showSummary="true"/>
            <p:dataTable id="comitesDataTable" value="#{comiteBean.obterComites('E')}" var="comite"
                         emptyMessage="Nenhuma informação a ser exibida"
                         paginator="true" rows="10" paginatorPosition="bottom">
                <p:column headerText="Portaria" filterBy="#{comite.portaria}" filterMatchMode="contains">
                    <h:outputText value="#{comite.portaria}"/>
                </p:column>

                <p:column headerText="Início da vigência">
                    <h:outputText value="#{comite.inicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Fim da vigência">
                    <h:outputText value="#{comite.fim}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Cadastrado por">
                    <h:outputText value="#{comite.coordenador.nomeCompleto}"/>
                </p:column>

                <p:column headerText="Operações">

                    <p:commandButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-info-circle">
                        <f:param name="comite" value="#{comite.id}"/>
                        <f:setPropertyActionListener value="#{comite}" target="#{comiteBean.comite}"/>
                    </p:commandButton >
                </p:column>

            </p:dataTable>

            <br/>

        </h:form>
    </ui:define>

</ui:composition>
