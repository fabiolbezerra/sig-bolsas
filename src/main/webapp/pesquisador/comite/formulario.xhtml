<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Cadastro de Comitê
    </ui:define>

    <ui:define name="content">
        <h1>Comitê</h1>

        <h:form id="formComite">
            <p:growl showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{comiteBean.comite.id}"/>
            <h:panelGrid columns="2">
                <p:outputLabel value="Portaria"/>
                <p:inputText value="#{comiteBean.comite.portaria}"/>

                <p:outputLabel value="Início da vigência"/>
                <p:calendar pattern="dd/MM/yyyy" value="#{comiteBean.comite.inicio}"/>

                <p:outputLabel value="Fim da vigência"/>
                <p:calendar pattern="dd/MM/yyyy" value="#{comiteBean.comite.fim}"/>

                <p:outputLabel value="Coordenador"/>
                <p:selectOneMenu converter="pessoaConverter" value="#{comiteBean.comite.coordenador}">
                    <f:selectItem noSelectionOption="true" itemLabel="Selecione uma pessoa como coordenador"/>
                    <f:selectItems value="#{pessoaBean.coordenadores}"
                                   var="p"
                                   itemValue="#{p}"
                                   itemLabel="#{p.nomeCompleto}"/>
                </p:selectOneMenu>
            </h:panelGrid>

            <p:panel rendered="#{comiteBean.comite.id != null or comiteBean.comite.id > 0}">
                Aqui Romão
            </p:panel>

            <br/>
            <p:button outcome="#{comiteBean.voltarFormulario()}" value="Cancelar" icon="fa fa-ban"/>
            <p:commandButton value="Salvar"
                             action="#{comiteBean.salvar()}"
                             update="@form"
                             icon="fa fa-floppy-o"/>
        </h:form>
    </ui:define>
</ui:composition>
