<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Formulário de Inscrição
    </ui:define>

    <ui:define name="content">
        <h1>Formulário</h1>

        <h:form id="formInscricao">

            <h2>Dados do Participante</h2>

            <h:panelGrid columns="2">
                <p:outputLabel value="Nome completo"/>
                <p:outputLabel value="#{pessoaBean.pessoa.nomeCompleto}"/>

                <p:outputLabel value="Telefone"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.pessoa.telefone}"/>

                <p:outputLabel value="E-mail"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.pessoa.email}"/>

                <p:outputLabel value="Data de nascimento"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.pessoa.nascimento}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </p:outputLabel>
            </h:panelGrid>

            <h2>Dados do Edital</h2>

            <h:panelGrid columns="2">
                <p:outputLabel value="Ano/Número"/>
                <p:outputLabel value="#{editalBean.edital.ano} / #{editalBean.edital.numero}"/>

                <p:outputLabel value="Situação"/>
                <p:outputLabel value="#{inscricaoBean.obterSituacao(inscricaoBean.inscricao.edital.situacao)}"/>

                <p:outputLabel value="Tipo"/>
                <p:outputLabel value="#{inscricaoBean.obterTipo(inscricaoBean.inscricao.edital.tipo)}"/>

                <p:outputLabel value="Início das inscrições"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.edital.dataInicio}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </p:outputLabel>

                <p:outputLabel value="Fim das inscrições"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.edital.dataFinal}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </p:outputLabel>

                <p:outputLabel value="Cadastrado"/>
                <p:outputLabel value="#{inscricaoBean.inscricao.edital.dataFinal}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </p:outputLabel>
            </h:panelGrid>

            <br/>

            <h:panelGrid columns="2">
                <p:outputLabel value="Digite sua senha"/>
                <p:password id="senhaAtual"
                            value="#{pessoaBean.senha}"/>
            </h:panelGrid>

            <p:commandButton value="Voltar" action="/pesquisador/edital/lista-abertos" update="@form"/>
            <p:commandButton value="Confirmar" action="#{inscricaoBean.salvar()}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
