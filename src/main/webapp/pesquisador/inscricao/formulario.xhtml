<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Nova Inscrição</title>
</h:head>

<h:body>
    <h:form>

        <h:inputHidden value="#{inscricaoBean.edital.id}"/>
        <h:inputHidden value="#{inscricaoBean.pesquisador.id}"/>

        <p:panel header="Nova Inscrição" style="width: 80%; margin: 20px auto;">
            <p:messages id="messages" showDetail="true" autoUpdate="true" />

            <p:panelGrid columns="2" style="width: 100%; margin-bottom: 20px;">
                <f:facet name="header">
                    <p:outputLabel value="Dados do Edital"/>
                </f:facet>

                <h:outputText value="Edital:" />
                <h:outputText value="#{inscricaoBean.edital.titulo}" />

                <h:outputText value="Ano/Número:" />
                <h:outputText value="#{inscricaoBean.edital.ano} / #{inscricaoBean.edital.numero}"/>

                <h:outputText value="Situação:" />
                <h:outputText value="#{inscricaoBean.obterSituacao(inscricaoBean.edital.situacao)}" />

                <h:outputText value="Tipo:" />
                <h:outputText value="#{inscricaoBean.obterTipo(inscricaoBean.edital.tipo)}"/>

                <h:outputText value="Início das inscrições:" />
                <h:outputText value="#{inscricaoBean.edital.dataInicio}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>

                <h:outputText value="Fim das inscrições:" />
                <h:outputText value="#{inscricaoBean.edital.dataFinal}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>

            </p:panelGrid>

            <p:panelGrid columns="2" style="width: 100%; margin-bottom: 20px;">
                <f:facet name="header">
                    <p:outputLabel value="Dados do Participante"/>
                </f:facet>

                <h:outputText value="Nome Completo:" />
                <h:outputText value="#{inscricaoBean.pesquisador.nomeCompleto}" />

                <h:outputText value="Telefone:" />
                <h:outputText value="#{inscricaoBean.pesquisador.telefone}" />

                <h:outputText value="Email:" />
                <h:outputText value="#{inscricaoBean.pesquisador.email}" />

                <h:outputText value="Senha:" />
                <p:password id="senha" value="#{inscricaoBean.senha}" feedback="true"
                            promptLabel="Digite a senha" weakLabel="Fraca" goodLabel="Boa"
                            strongLabel="Forte" required="true" requiredMessage="Senha obrigatória"/>
            </p:panelGrid>

            <p:commandButton value="Confirmar Inscrição" action="#{inscricaoBean.novaInscricao()}"
                             icon="pi pi-check" update="messages" style="margin-top: 20px;" >
                 <f:param name="editalID" value="#{inscricaoBean.edital.id}"/>
                 <f:param name="pesquisadorID" value="#{inscricaoBean.pesquisador.id}"/>
            </p:commandButton>

            <p:commandButton value="Cancelar" action="/pesquisador/edital/lista-abertos.xhtml?faces-redirect=true"
                             styleClass="ui-button-secondary" icon="pi pi-times" immediate="true"
                             style="margin-top: 20px; margin-left: 10px;"/>
        </p:panel>
    </h:form>
</h:body>
</html>
