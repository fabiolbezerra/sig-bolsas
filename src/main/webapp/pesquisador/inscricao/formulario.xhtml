<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <ui:define name="title">Formulário de Inscrição</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-pencil"></i>
                    Formulário de Inscrição
                </h1>

                <p:button outcome="/bolsista/edital/lista-abertos.xhtml"
                          value="Cancelar"
                          icon="pi pi-times"
                          styleClass="ui-button-secondary outline"/>
            </div>

            <div class="content-card">
                <h:form id="formInscricao">
                    <p:messages id="messages" showDetail="true" autoUpdate="true"/>

                    <h:inputHidden value="#{inscricaoBean.edital.id}"/>
                    <h:inputHidden value="#{inscricaoBean.pesquisador.id}"/>

                    <!-- Dados do Edital -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-file"></i>
                            Dados do Edital
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Edital"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.edital.titulo}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Ano/Número"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.edital.ano} / #{inscricaoBean.edital.numero}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Situação"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.obterSituacao(inscricaoBean.edital.situacao)}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Tipo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.obterTipo(inscricaoBean.edital.tipo)}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Início das Inscrições"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.edital.dataInicio}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Fim das Inscrições"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.edital.dataFinal}"
                                              style="font-weight: 600; color: #212529;">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <!-- Dados do Participante -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-user"></i>
                            Dados do Participante
                        </h2>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div class="info-group">
                                <p:outputLabel value="Nome Completo"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.pesquisador.nomeCompleto}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Telefone"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.pesquisador.telefone}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                            <div class="info-group">
                                <p:outputLabel value="Email"
                                               style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.25rem;"/>
                                <h:outputText value="#{inscricaoBean.pesquisador.email}"
                                              style="font-weight: 600; color: #212529;"/>
                            </div>
                        </div>
                    </div>

                    <!-- Confirmação de Senha -->
                    <div style="margin-bottom: 2.5rem;">
                        <h2 style="font-size: 1.25rem; color: #036fab; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.5rem;">
                            <i class="pi pi-lock"></i>
                            Confirmação de Segurança
                        </h2>
                        <div style="max-width: 400px;">
                            <p:outputLabel for="senha" value="Senha"
                                           style="display: block; font-size: 0.85rem; color: #6c757d; margin-bottom: 0.5rem; font-weight: 600;"/>
                            <p:password id="senha"
                                        value="#{inscricaoBean.senha}"
                                        feedback="true"
                                        promptLabel="Digite a senha"
                                        weakLabel="Fraca"
                                        goodLabel="Boa"
                                        strongLabel="Forte"
                                        required="true"
                                        requiredMessage="Senha obrigatória"
                                        style="width: 100%;"/>
                        </div>
                    </div>

                    <!-- Botões de Ação -->
                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <p:commandButton value="Confirmar Inscrição"
                                         action="#{inscricaoBean.novaInscricao()}"
                                         update="messages"
                                         icon="pi pi-check"
                                         styleClass="ui-button-success">
                            <f:param name="editalID" value="#{inscricaoBean.edital.id}"/>
                            <f:param name="pesquisadorID" value="#{inscricaoBean.pesquisador.id}"/>
                        </p:commandButton>

                        <p:button outcome="/bolsista/edital/lista-abertos.xhtml"
                                  value="Cancelar"
                                  icon="pi pi-times"
                                  styleClass="ui-button-secondary outline"/>
                    </div>
                </h:form>
            </div>
        </div>

    </ui:define>

</ui:composition>
