<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Acompanhamento das Minhas Inscrições</ui:define>

    <ui:define name="content">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="pi pi-list-check"></i>
                    Acompanhamento das Minhas Inscrições
                </h1>
            </div>

            <div class="content-card">
                <h:form id="formStatus">
                    <p:growl showDetail="true" showSummary="true"/>

                    <p:dataTable value="#{inscricaoBean.obterPorPesquisador()}"
                                 var="inscricao"
                                 emptyMessage="Você não possui inscrições cadastradas."
                                 paginator="true"
                                 rows="10"
                                 paginatorPosition="bottom"
                                 reflow="true">

                        <p:column headerText="Edital" priority="1">
                            <div style="display: flex; flex-direction: column;">
                                <h:outputText value="#{inscricao.edital.titulo}"
                                              style="font-weight: 600; color: #2c3e50;"/>
                                <h:outputText value="Ano: #{inscricao.edital.ano}"
                                              style="font-size: 0.85rem; color: #666;"/>
                            </div>
                        </p:column>

                        <p:column headerText="Protocolo" priority="2" style="width:160px;">
                            <h:outputText value="#{inscricao.protocolo}"
                                          style="font-family: monospace; font-size: 0.9rem;"/>
                        </p:column>

                        <p:column headerText="Data" priority="3" style="width:110px;">
                            <h:outputText value="#{inscricao.dataInscricao}">
                                <f:convertDateTime pattern="dd/MM/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Pontuação" priority="3" style="width:100px; text-align:center;">
                            <h:outputText value="#{inscricao.pontuacaoPesquisador + inscricao.pontuacaoComite}">
                                <f:convertNumber maxFractionDigits="2"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Classificação" priority="2" style="width:120px; text-align:center;">
                            <p:tag value="#{inscricao.classificacao == 0 ? 'Aguardando' : inscricao.classificacao}"
                                   severity="#{inscricao.classificacao == 1 ? 'success' :
                                               inscricao.classificacao == 0 ? 'warning' : 'info'}"/>
                        </p:column>

                        <p:column headerText="Situação" priority="1" style="width:130px; text-align:center;">
                            <p:tag value="#{inscricaoBean.obterSituacaoLabel(inscricao.situacao)}"
                                   severity="#{inscricao.situacao == 'A' ? 'success' :
                                               inscricao.situacao == 'I' ? 'danger' :
                                               inscricao.situacao == 'H' ? 'info' : 'warning'}"/>
                        </p:column>

                        <p:column headerText="Detalhes" priority="1" style="width:80px; text-align:center;">
                            <p:commandButton icon="pi pi-eye"
                                             title="Ver detalhes"
                                             styleClass="ui-button-info"
                                             action="/pesquisador/inscricao/detalhes.xhtml?faces-redirect=true">
                                <f:param name="inscricaoID" value="#{inscricao.id}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>

                    <!-- Painel de indeferimento expandido -->
                    <p:dataTable value="#{inscricaoBean.obterPorPesquisador()}"
                                 var="inscricao"
                                 emptyMessage=""
                                 rendered="#{not empty inscricaoBean.obterPorPesquisador()}"
                                 style="margin-top: 1.5rem;">
                        <f:facet name="header">Inscrições Indeferidas — Motivos</f:facet>
                        <p:column rendered="#{inscricao.situacao == 'I'}">
                            <ui:fragment rendered="#{inscricao.situacao == 'I'}">
                                <div style="background: #fff5f5; border-left: 4px solid #e53e3e; padding: 0.75rem 1rem; border-radius: 4px;">
                                    <strong>#{inscricao.edital.titulo}</strong> — Protocolo: #{inscricao.protocolo}
                                    <p style="margin-top: 0.5rem; color: #555;">
                                        <i class="pi pi-info-circle"/> #{inscricao.motivoIndeferimento != null ? inscricao.motivoIndeferimento : 'Motivo não informado.'}
                                    </p>
                                </div>
                            </ui:fragment>
                        </p:column>
                    </p:dataTable>

                </h:form>
            </div>
        </div>
    </ui:define>

</ui:composition>
