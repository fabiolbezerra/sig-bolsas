<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="Editais">
    </ui:define>

    <ui:define name="content">
        <h1> Listagem de Editais </h1>

        <p:link value="Voltar" outcome="/pesquisador/principal.xhtml"/> | <p:link value="Cadastrar" outcome="/pesquisador/edital/formulario.xhtml"/>

        <h:form id="formEdital">
            <p:growl showDetail="true" showSummary="true"/>

            <p:commandLink value="Cadastrar edital" action="formulario.xhtml"/> <br/><br/>
            <p:commandLink value="Voltar" action="/pesquisador/principal.xhtml"/> <br/><br/>

            <p:dataTable value="#{editalBean.editais}" var="edital">
                <p:column headerText="Título">
                    <h:outputText value="#{edital.titulo}"/>
                </p:column>

                <p:column headerText="Ano e Número">
                    <h:outputText value="#{edital.ano}"/> / <h:outputText value="#{edital.numero}"/>
                </p:column>

                <p:column headerText="Cadastro">
                    <h:outputText value="#{edital.dataCadastro}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Inscrições">
                    <h:outputText value="#{edital.dataInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                    a
                    <h:outputText value="#{edital.dataFinal}">
                        <f:convertDateTime pattern="dd/MM/yyyy"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Operações">
                    <p:commandLink value="Editar" action="formulario.xhtml">
                        <f:setPropertyActionListener value="#{edital}" target="#{editalBean.edital}"/>
                    </p:commandLink>
                    |
                    <p:commandLink value="Detalhes" action="detalhes.xhtml">
                        <f:setPropertyActionListener value="#{edital}" target="#{editalBean.edital}"/>
                    </p:commandLink>
                </p:column>
            </p:dataTable>

            <br/>

            <p:link value="Voltar" outcome="/pesquisador/principal.xhtml"/>
        </h:form>

    </ui:define>

</ui:composition>
