<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Cadastro de Edital
    </ui:define>

    <ui:define name="content">
        <h1>Edital</h1>

        <h:form id="formEdital">
            <p:growl showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{editalBean.edital.id}"/>
            <h:inputHidden value="#{editalBean.edital.dataCadastro}">
                <f:convertDateTime pattern="dd/MM/yyyy hh:mm"/>
            </h:inputHidden>
            
            <h:panelGrid columns="2">
                <p:outputLabel value="Título"/>
                <p:inputText value="#{editalBean.edital.titulo}"/>

                <p:outputLabel value="Ano"/>
                <p:inputMask mask="9999" value="#{editalBean.edital.ano}"/>

                <p:outputLabel value="Número"/>
                <p:inputText value="#{editalBean.edital.numero}" size="5"/>

                <p:outputLabel value="Início das inscrições"/>
                <p:calendar pattern="dd/MM/yyyy" value="#{editalBean.edital.dataInicio}"/>

                <p:outputLabel value="Fim das inscrições"/>
                <p:calendar pattern="dd/MM/yyyy" value="#{editalBean.edital.dataFinal}"/>

                <p:outputLabel value="Situação"/>
                <p:selectOneMenu value="#{editalBean.edital.situacao}">
                    <f:selectItem itemValue="C" itemLabel="Cadastrado"/>
                    <f:selectItem itemValue="P" itemLabel="Publicado"/>
                    <f:selectItem itemValue="N" itemLabel="Não publicado"/>
                    <f:selectItem itemValue="E" itemLabel="Encerrado"/>
                </p:selectOneMenu>

                <p:outputLabel value="Tipo"/>
                <p:selectOneMenu value="#{editalBean.edital.tipo}">
                    <f:selectItem itemValue="P" itemLabel="Pesquisa"/>
                    <f:selectItem itemValue="D" itemLabel="Desenvolvimento Tecnológico"/>
                    <f:selectItem itemValue="E" itemLabel="Extensão"/>
                </p:selectOneMenu>

                <p:outputLabel value="Comitê"/>
                <p:selectOneMenu converter="comiteConverter" value="#{editalBean.edital.comite}" required="true">
                    <f:selectItem noSelectionOption="true" itemLabel="Selecione o comitê"/>
                    <f:selectItems value="#{comiteBean.comites}" var="c" itemValue="#{c}" itemLabel="#{c.portaria}"/>
                </p:selectOneMenu>

                <p:outputLabel value="Coordenador"/>
                <p:selectOneMenu converter="pessoaConverter" value="#{editalBean.edital.coordenador}" required="true">
                    <f:selectItem noSelectionOption="true" itemLabel="Selecione uma pessoa como coordenador"/>
                    <f:selectItems value="#{pessoaBean.coordenadores}" var="coordenador"
                                   itemValue="#{coordenador}" itemLabel="#{coordenador.nomeCompleto}"/>
                </p:selectOneMenu>

                <p:outputLabel value="Formulário de inscrição"/>
                <p:selectOneMenu converter="formularioConverter" value="#{editalBean.edital.formulario}">
                    <f:selectItem noSelectionOption="true" itemLabel="Selecione um formulário"/>
                    <f:selectItems value="#{formularioBean.formularios}" var="formulario"
                                   itemValue="#{formulario}" itemLabel="#{formulario.nome}"/>
                </p:selectOneMenu>
            </h:panelGrid>

            <p:button outcome="lista.xhtml" value="Cancelar" icon="fa fa-ban"/>
            <p:commandButton value="Salvar" action="#{editalBean.salvar()}" update="@form" icon="fa fa-floppy-o"/>
        </h:form>
    </ui:define>
</ui:composition>
