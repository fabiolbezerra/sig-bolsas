<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="Editais">
        Editais Abertos
    </ui:define>

    <ui:define name="content">
        <h1> Editais com Inscrição Aberta </h1>

        <br/>

        <p:link value="Inicio" outcome="/pesquisador/principal.xhtml"/>

        <br/><br/>

        <h:form id="formEdital">
            <p:growl showDetail="true" showSummary="true"/>

            <p:carousel value="#{editalBean.editaisAbertos}"
                        var="edital"
                        numVisible="2"
                        autoPlayInterval="10000">

                <p:panelGrid columns="4" >
                    <f:facet name="header">
                        <h:outputText value="#{edital.titulo}"/>
                    </f:facet>

                    <p:outputLabel value="Ano/Número"/>
                    <p:outputPanel>
                        <h:outputText value="#{edital.ano}"/> / <h:outputText value="#{edital.numero}"/>
                    </p:outputPanel>

                    <p:outputLabel value="Inscrições"/>
                    <p:outputPanel>
                        <h:outputText value="#{edital.dataInicio}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </h:outputText>
                        a
                        <h:outputText value="#{edital.dataFinal}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:outputPanel>

                    <p:outputLabel value="Situação"/>
                    <h:outputText value="#{editalBean.obterSituacao(edital.situacao)}"/>

                    <p:outputLabel value="Tipo"/>
                    <h:outputText value="#{editalBean.obterTipo(edital.tipo)}"/>

                    <f:facet name="footer">
                        <p:splitButton value="Detalhes" action="detalhes.xhtml" icon="fa fa-search">
                            <f:setPropertyActionListener value="#{edital}" target="#{editalBean.edital}"/>

                            <p:menuitem value="Editar" action="formulario.xhtml" icon="fa fa-pencil">
                                <f:setPropertyActionListener value="#{edital}" target="#{editalBean.edital}"/>
                            </p:menuitem>
                        </p:splitButton>
                    </f:facet>
                </p:panelGrid>
            </p:carousel>

            <br/>

            <p:link value="Inicio" outcome="/pesquisador/principal.xhtml"/>
        </h:form>

    </ui:define>

</ui:composition>
