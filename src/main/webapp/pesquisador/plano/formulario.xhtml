<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

   <ui:define name="title">
      Cadastro de Plano de Trabalho
   </ui:define>

   <ui:define name="content">
      <h1>Plano de Trabalho</h1>
      <h:form id="formPlanoDeTrabalho">
         <p:growl showDetail="true" showSummary="true"/>

         <h:panelGrid columns="2">
            <p:outputLabel value="Título" for="titulo"/>
            <p:inputText id="titulo" value="#{planoDeTrabalhoBean.planoDeTrabalho.titulo}"
                         required="true" requiredMessage="O título é obrigatório"
                         style="width: 400px;"/>

            <p:outputLabel value="Resumo" for="resumo"/>
            <p:inputTextarea id="resumo" value="#{planoDeTrabalhoBean.planoDeTrabalho.resumo}"
                             rows="5" cols="50" autoResize="false"
                             required="true" requiredMessage="O resumo é obrigatório"/>

            <p:outputLabel value="Data de Cadastro" rendered="#{planoDeTrabalhoBean.planoDeTrabalho.id != null}"/>
            <h:outputText value="#{planoDeTrabalhoBean.planoDeTrabalho.dataCadastro}" rendered="#{planoDeTrabalhoBean.planoDeTrabalho.id != null}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </h:outputText>
         </h:panelGrid>
         <br/><br/>
         <p:button outcome = "/pesquisador/inscricao/lista.xhtml?faces-redirect=true" value="Cancelar" icon="pi pi-times"/>
         <p:commandButton value="Salvar" action="#{planoDeTrabalhoBean.salvar()}"
                          update="@form" icon="pi pi-check" process="@form"/>
      </h:form>
   </ui:define>
</ui:composition>
