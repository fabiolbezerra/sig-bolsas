<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core">

   <ui:define name="title">
      Detalhes
   </ui:define>

   <ui:define name="content">

      <h1>#{planoDeTrabalhoBean.planoDeTrabalho.titulo}</h1>

      <h:form id="formPlanoDeTrabalho">

         <h:panelGrid columns="2">
            <p:outputLabel value="Título"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.titulo}"/>

            <p:outputLabel value="Resumo"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.titulo}"/>

            <p:outputLabel value="Pesquisador"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.pessoa.nomeCompleto}"/>

            <p:outputLabel value="Telefone"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.pessoa.telefone}" converter="telefoneConverter"/>

            <p:outputLabel value="E-mail"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.pessoa.email}"/>

            <p:outputLabel value="Data de Cadastro"/>
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.dataCadastro}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </p:outputLabel>
         </h:panelGrid>

         <h2>Dados do Edital</h2>

         <h:panelGrid columns="2">
            <p:outputLabel value="Edital:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.titulo}" />

            <p:outputLabel value="Ano/Número:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.ano} / #{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.numero}"/>

            <p:outputLabel value="Situação:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.obterSituacao(planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.situacao)}" />

            <p:outputLabel value="Tipo:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.obterTipo(planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.tipo)}"/>

            <p:outputLabel value="Início das inscrições:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.dataInicio}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </p:outputLabel>

            <p:outputLabel value="Fim das inscrições:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.dataFinal}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </p:outputLabel>

            <p:outputLabel value="Cadastrado:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.edital.dataCadastro}">
               <f:convertDateTime pattern="dd/MM/yyyy"/>
            </p:outputLabel>
         </h:panelGrid>

         <h2>Dados da Inscrição</h2>
         <h:panelGrid columns="2">
            <p:outputLabel value="Protocolo:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.protocolo}" />

            <p:outputLabel value="Data de Inscrição:" />
            <p:outputLabel value="#{planoDeTrabalhoBean.planoDeTrabalho.inscricao.dataInscricao}">
               <f:convertDateTime pattern="dd/MM/yyyy" />
            </p:outputLabel>
         </h:panelGrid>

         <br/>

         <p:commandLink value="Voltar" action="/gerente/plano/lista.xhtml" icon = "fa fa-arrow-left"/>
      </h:form>
   </ui:define>
</ui:composition>
