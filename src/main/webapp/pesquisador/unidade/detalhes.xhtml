<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">
        Detalhes
    </ui:define>

    <ui:define name="content">
        <h1>
            <h:outputText value="#{unidadeAdministrativaBean.unidade.nome}"/>
        </h1>

        <h:form id="formComite">

            <h2>Nome</h2>

            <p:column headerText="Nome">
                <h:outputText value="#{unidadeAdministrativaBean.unidade.nome}"/>
            </p:column>

            <h2>Sigla</h2>

            <p:column headerText="Sigla">
                <h:outputText value="#{unidadeAdministrativaBean.unidade.sigla}"/>
            </p:column>

            <h2>Membros</h2>

            <p:dataList value="#{unidadeAdministrativaBean.unidade.membros}" var="membros" emptyMessage="Nenhum membro">
                <h:outputText value="#{membros.nomeCompleto}"/>
            </p:dataList>

            <br/>

            <p:commandLink value="Voltar" action="lista.xhtml"/>
        </h:form>
    </ui:define>
</ui:composition>
