<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
        template="/template.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
>

    <ui:define name="title">
        Cadastro de Unidade Administrativa
    </ui:define>

    <ui:define name="content">
        <h1>Unidade Administrativa</h1>

        <h:form id="formUnidadeAdministrativa">
            <p:growl showDetail="true" showSummary="true"/>

            <h:inputHidden value="#{unidadeAdministrativaBean.unidade.id}"/>
            <h:panelGrid columns="2">

                <p:outputLabel value="Nome"/>
                <p:inputText value="#{unidadeAdministrativaBean.unidade.nome}"/>

                <p:outputLabel value="Sigla"/>
                <p:inputText value="#{unidadeAdministrativaBean.unidade.sigla}"
                             required="true"
                             requiredMessage="A sigla da unidade é obrigatória"/>

                <p:outputLabel value="Tipo"/>
                <p:selectOneMenu value="#{unidadeAdministrativaBean.unidade.tipo}">
                    <f:selectItem noSelectionOption="true" itemLabel="Selecione o tipo"/>
                    <f:selectItem itemValue="I" itemLabel="Instituto"/>
                    <f:selectItem itemValue="C" itemLabel="Campus"/>
                </p:selectOneMenu>

            </h:panelGrid>

            <p:button outcome="lista.xhtml" value="Cancelar"/>
            <p:commandButton value="Salvar" action="#{unidadeAdministrativaBean.salvar()}" update="@form"/>
        </h:form>
    </ui:define>
</ui:composition>
