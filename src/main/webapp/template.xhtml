<?xml version='1.0' encoding='UTF-8' ?> 
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <h:outputStylesheet library="css" name="default.css"/>
        <h:outputStylesheet library="css" name="cssLayout.css"/>
        <title>
            <ui:insert name="title">
                Título da Página
            </ui:insert>
        </title>
    </h:head>

    <h:body>

        <div id="top" class="top">
            <ui:insert name="top">
                <p:outputPanel rendered="#{papelBean.usuarioLogado != null}">
                    Olá #{papelBean.usuarioLogado.nomeCompleto}!

                    <div class="top_direita">
                        <p:link value="Início" outcome="#{papelBean.irParaPaginaPrincipal()}"/> |
                        <p:link value="Alterar senha" outcome="/pesquisador/principal.xhtml"/> |
                        <p:link value="Alterar e-mail" outcome="/pesquisador/principal.xhtml"/> |
                        <p:link href="#{request.contextPath}/j_spring_security_logout" value="Sair"/>
                    </div>
                    <br/>
                </p:outputPanel>
                <p:outputPanel rendered="#{papelBean.usuarioLogado != null}">
                    | 
                    <ui:repeat value="#{papelBean.usuarioLogado.pessoaPapels}" var="permissao">
                        #{permissao.papel.nome} |
                    </ui:repeat>
                </p:outputPanel>
            </ui:insert>
        </div>

        <div id="content" class="center_content">
            <ui:insert name="content">
                Content
            </ui:insert>
        </div>

    </h:body>

</html>
