<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>
        <ui:insert name="title">
            Título da Página
        </ui:insert>
    </title>

    <h:outputStylesheet library="css" name="default.css"/>
    <h:outputStylesheet library="css" name="Layout.css"/>
    <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>


</h:head>

<h:body>

    <div id="top" class="top">
        <ui:insert name="top">
            <p:outputPanel rendered="#{papelBean.usuarioLogado != null}" style="width: 100%;">
                <div class="navbar-container">
                    <!-- Logo/Brand -->
                    <h:link outcome="#{papelBean.irParaPaginaPrincipal()}" styleClass="navbar-brand">
                        <i class="pi pi-graduation-cap"></i>
                        <span>SIG Bolsas</span>
                    </h:link>
                    <!-- User Section -->
                    <div class="navbar-user">
                        <h:form id="form_menu"
                                style="display: flex; align-items: center; gap: 1.5rem; justify-content: flex-end;">
                            <!-- User Info with Avatar -->
                            <div class="user-info">
                                <div class="user-avatar">
                                    #{papelBean.usuarioLogado.nomeCompleto.substring(0,1).toUpperCase()}
                                </div>
                                <div class="user-details">
                                    <div class="user-name">
                                        #{papelBean.usuarioLogado.nomeCompleto}
                                    </div>
                                    <div class="user-roles">
                                        <ui:repeat value="#{papelBean.usuarioLogado.pessoaPapels}" var="permissao">
                                            <span class="user-role-badge">#{permissao.papel.nome}</span>
                                        </ui:repeat>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="navbar-actions">
                                <h:link outcome="#{papelBean.irParaPaginaPrincipal()}" styleClass="navbar-btn"
                                        title="Início">
                                    <i class="pi pi-home"></i>
                                    <span>Início</span>
                                </h:link>

                                <p:menuButton icon="pi pi-user" styleClass="navbar-btn" title="Perfil">
                                    <p:menuitem value="Alterar Senha"
                                                icon="pi pi-lock"
                                                outcome="/bolsista/pessoa/formulario-senha.xhtml">
                                        <f:param name="pessoaID" value="#{papelBean.usuarioLogado.id}"/>
                                    </p:menuitem>
                                    <p:menuitem value="Alterar E-mail"
                                                icon="pi pi-envelope"
                                                outcome="/bolsista/pessoa/formulario-email.xhtml">
                                        <f:param name="pessoaID" value="#{papelBean.usuarioLogado.id}"/>
                                    </p:menuitem>
                                    <p:separator/>
                                    <p:menuitem value="Meu Perfil"
                                                icon="pi pi-user"
                                                outcome="/bolsista/pessoa/detalhes.xhtml">
                                        <f:param name="pessoaID" value="#{papelBean.usuarioLogado.id}"/>
                                    </p:menuitem>
                                </p:menuButton>

                                <h:outputLink value="#{request.contextPath}/j_spring_security_logout"
                                              styleClass="navbar-btn primary" title="Sair">
                                    <i class="pi pi-sign-out"></i>
                                    <span>Sair</span>
                                </h:outputLink>
                            </div>
                        </h:form>
                    </div>
                </div>
            </p:outputPanel>

            <!-- Fallback quando não há usuário logado -->
            <p:outputPanel rendered="#{papelBean.usuarioLogado == null}" style="width: 100%;">
                <div class="navbar-container">
                    <h:link outcome="/index.xhtml" styleClass="navbar-brand">
                        <i class="pi pi-graduation-cap"></i>
                        <span>SIG Bolsas</span>
                    </h:link>
                </div>
            </p:outputPanel>
        </ui:insert>
    </div>

    <div id="content" class="center_content">
        <ui:insert name="content">
            Content
        </ui:insert>
    </div>

</h:body>

</html>
